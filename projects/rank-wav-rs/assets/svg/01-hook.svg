<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <text x="100" y="150" font-size="80" opacity="0.15">🎵</text>
  <text x="1750" y="900" font-size="80" opacity="0.15">🔊</text>
  <circle cx="1800" cy="200" r="100" fill="#4ade80" opacity="0.08"/>

  <!-- Main headline -->
  <text x="960" y="180" font-family="Arial Black, sans-serif" font-size="72"
        fill="#ff6b6b" text-anchor="middle" filter="url(#glow)">
    The Audio Comparison Problem
  </text>

  <!-- Problem illustration -->
  <rect x="150" y="250" width="1620" height="350" rx="24" fill="url(#cardGrad)"/>
  <rect x="150" y="250" width="1620" height="8" rx="4" fill="#ff6b6b"/>

  <!-- File grid showing many WAV files -->
  <g transform="translate(200, 300)">
    <text x="0" y="0" font-family="Courier New" font-size="32" fill="#888">motifs/</text>

    <g transform="translate(0, 50)">
      <text x="0" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_001.wav</text>
      <text x="320" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_002.wav</text>
      <text x="640" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_003.wav</text>
      <text x="960" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_004.wav</text>
      <text x="1280" y="0" font-family="Courier New" font-size="28" fill="#888">...</text>
    </g>
    <g transform="translate(0, 90)">
      <text x="0" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_005.wav</text>
      <text x="320" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_006.wav</text>
      <text x="640" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_007.wav</text>
      <text x="960" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_008.wav</text>
      <text x="1280" y="0" font-family="Courier New" font-size="28" fill="#888">...</text>
    </g>
    <g transform="translate(0, 130)">
      <text x="0" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_009.wav</text>
      <text x="320" y="0" font-family="Courier New" font-size="28" fill="#4ade80">motif_010.wav</text>
      <text x="640" y="0" font-family="Courier New" font-size="28" fill="#888">... 40 more files</text>
    </g>

    <text x="0" y="220" font-family="Arial" font-size="36" fill="#ff6b6b">
      ❌ Listen to each one manually?
    </text>
    <text x="700" y="220" font-family="Arial" font-size="36" fill="#ff6b6b">
      ❌ Compare A/B for 50 variants?
    </text>
  </g>

  <!-- Bottom pain points -->
  <rect x="150" y="680" width="520" height="180" rx="20" fill="url(#cardGrad)"/>
  <text x="410" y="750" font-family="Arial" font-size="48" fill="#ffd93d" text-anchor="middle">⏱️</text>
  <text x="410" y="810" font-family="Arial" font-size="36" fill="#aaa" text-anchor="middle">Time consuming</text>

  <rect x="700" y="680" width="520" height="180" rx="20" fill="url(#cardGrad)"/>
  <text x="960" y="750" font-family="Arial" font-size="48" fill="#ffd93d" text-anchor="middle">🎲</text>
  <text x="960" y="810" font-family="Arial" font-size="36" fill="#aaa" text-anchor="middle">Subjective decisions</text>

  <rect x="1250" y="680" width="520" height="180" rx="20" fill="url(#cardGrad)"/>
  <text x="1510" y="750" font-family="Arial" font-size="48" fill="#ffd93d" text-anchor="middle">😴</text>
  <text x="1510" y="810" font-family="Arial" font-size="36" fill="#aaa" text-anchor="middle">Ear fatigue</text>
</svg>
