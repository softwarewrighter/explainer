<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="8" dy="8" in="SourceAlpha" result="offset1"/>
      <feFlood flood-color="#000000" flood-opacity="0.9"/>
      <feComposite in2="offset1" operator="in" result="shadow1"/>
      <feOffset dx="4" dy="4" in="SourceAlpha" result="offset2"/>
      <feFlood flood-color="#1a1a1a"/>
      <feComposite in2="offset2" operator="in" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main title - 3D block style -->
  <g filter="url(#shadow3d)">
    <!-- Black outline/stroke layer -->
    <text x="960" y="200" font-family="Impact, Arial Black, sans-serif" font-size="140"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="12"
          text-anchor="middle" letter-spacing="4">
      So You Think
    </text>
    <text x="960" y="350" font-family="Impact, Arial Black, sans-serif" font-size="140"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="12"
          text-anchor="middle" letter-spacing="4">
      You Can WAV
    </text>

    <!-- Lime green fill -->
    <text x="960" y="200" font-family="Impact, Arial Black, sans-serif" font-size="140"
          font-weight="bold" fill="#32CD32" stroke="#000000" stroke-width="4"
          text-anchor="middle" letter-spacing="4">
      So You Think
    </text>
    <text x="960" y="350" font-family="Impact, Arial Black, sans-serif" font-size="140"
          font-weight="bold" fill="#32CD32" stroke="#000000" stroke-width="4"
          text-anchor="middle" letter-spacing="4">
      You Can WAV
    </text>
  </g>

  <!-- Bottom subtitle -->
  <g filter="url(#shadow3d)">
    <text x="960" y="980" font-family="Impact, Arial Black, sans-serif" font-size="72"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="8"
          text-anchor="middle" letter-spacing="2">
      sw-cli-tools/rank-wav-rs for AI Agents
    </text>
    <text x="960" y="980" font-family="Impact, Arial Black, sans-serif" font-size="72"
          font-weight="bold" fill="#32CD32" stroke="#000000" stroke-width="3"
          text-anchor="middle" letter-spacing="2">
      sw-cli-tools/rank-wav-rs for AI Agents
    </text>
  </g>

  <!-- Decorative stars/sparkles -->
  <text x="150" y="280" font-size="60" opacity="0.9" filter="url(#glow)">⭐</text>
  <text x="1720" y="280" font-size="60" opacity="0.9" filter="url(#glow)">⭐</text>
  <text x="100" y="180" font-size="40" opacity="0.7">✨</text>
  <text x="1780" y="180" font-size="40" opacity="0.7">✨</text>
  <text x="200" y="380" font-size="35" opacity="0.6">✨</text>
  <text x="1680" y="380" font-size="35" opacity="0.6">✨</text>
</svg>
