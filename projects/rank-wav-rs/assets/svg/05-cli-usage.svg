<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative -->
  <text x="1750" y="150" font-size="70" opacity="0.15">💻</text>
  <circle cx="100" cy="950" r="60" fill="#4ade80" opacity="0.1"/>

  <!-- Headline -->
  <text x="960" y="100" font-family="Arial Black, sans-serif" font-size="64"
        fill="#4ade80" text-anchor="middle" filter="url(#glow)">
    Simple Command Line Interface
  </text>

  <!-- Terminal mockup -->
  <rect x="150" y="180" width="1620" height="800" rx="20" fill="#0a0a14"/>
  <circle cx="200" cy="220" r="12" fill="#ff6b6b"/>
  <circle cx="240" cy="220" r="12" fill="#ffd93d"/>
  <circle cx="280" cy="220" r="12" fill="#4ade80"/>

  <!-- Command examples -->
  <text x="200" y="300" font-family="Courier New" font-size="28" fill="#888"># Basic usage - scan directory</text>
  <text x="200" y="345" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="240" y="345" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./samples</text>

  <text x="200" y="420" font-family="Courier New" font-size="28" fill="#888"># Choose scoring mode</text>
  <text x="200" y="465" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="240" y="465" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./samples</text>
  <text x="620" y="465" font-family="Courier New" font-size="32" fill="#00d4ff">--sort best</text>

  <text x="200" y="540" font-family="Courier New" font-size="28" fill="#888"># Recursive subdirectory scan</text>
  <text x="200" y="585" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="240" y="585" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./audio-library</text>
  <text x="720" y="585" font-family="Courier New" font-size="32" fill="#ffd93d">-r</text>

  <text x="200" y="660" font-family="Courier New" font-size="28" fill="#888"># JSON output for scripting</text>
  <text x="200" y="705" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="240" y="705" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./samples</text>
  <text x="620" y="705" font-family="Courier New" font-size="32" fill="#ff6b6b">--json</text>
  <text x="780" y="705" font-family="Courier New" font-size="32" fill="#888">| jq '.[0]'</text>

  <text x="200" y="780" font-family="Courier New" font-size="28" fill="#888"># Combine all options</text>
  <text x="200" y="825" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="240" y="825" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./library</text>
  <text x="580" y="825" font-family="Courier New" font-size="32" fill="#ffd93d">-r</text>
  <text x="640" y="825" font-family="Courier New" font-size="32" fill="#00d4ff">--sort best</text>
  <text x="900" y="825" font-family="Courier New" font-size="32" fill="#ff6b6b">--json</text>
  <text x="1040" y="825" font-family="Courier New" font-size="32" fill="#888">> results.json</text>

  <!-- Legend -->
  <rect x="200" y="880" width="1520" height="70" rx="12" fill="#1a1a3e"/>
  <circle cx="280" cy="915" r="10" fill="#ffd93d"/>
  <text x="300" y="925" font-family="Arial" font-size="28" fill="#888">-r recursive</text>
  <circle cx="550" cy="915" r="10" fill="#00d4ff"/>
  <text x="570" y="925" font-family="Arial" font-size="28" fill="#888">--sort mode</text>
  <circle cx="850" cy="915" r="10" fill="#ff6b6b"/>
  <text x="870" y="925" font-family="Arial" font-size="28" fill="#888">--json output</text>
  <circle cx="1150" cy="915" r="10" fill="#4ade80"/>
  <text x="1170" y="925" font-family="Arial" font-size="28" fill="#888">Pure Rust, no dependencies</text>
</svg>
