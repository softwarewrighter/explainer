<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative -->
  <text x="1750" y="150" font-size="80" opacity="0.15">🎯</text>
  <circle cx="150" cy="900" r="80" fill="#00d4ff" opacity="0.08"/>

  <!-- Headline -->
  <text x="960" y="120" font-family="Arial Black, sans-serif" font-size="72"
        fill="#4ade80" text-anchor="middle" filter="url(#glow)">
    The Solution: rank-wav
  </text>

  <!-- Flow diagram -->
  <rect x="100" y="200" width="400" height="280" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="200" width="400" height="8" rx="4" fill="#00d4ff"/>
  <text x="300" y="300" font-family="Arial" font-size="64" fill="#00d4ff" text-anchor="middle">📁</text>
  <text x="300" y="380" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">WAV Directory</text>
  <text x="300" y="430" font-family="Courier New" font-size="28" fill="#888" text-anchor="middle">50 audio files</text>

  <!-- Arrow 1 -->
  <polygon points="530,340 580,310 580,330 680,330 680,350 580,350 580,370" fill="#4ade80"/>

  <rect x="710" y="200" width="500" height="280" rx="24" fill="url(#cardGrad)"/>
  <rect x="710" y="200" width="500" height="8" rx="4" fill="#4ade80"/>
  <text x="960" y="300" font-family="Arial" font-size="64" fill="#4ade80" text-anchor="middle">🔬</text>
  <text x="960" y="380" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">Acoustic Analysis</text>
  <text x="960" y="430" font-family="Courier New" font-size="28" fill="#888" text-anchor="middle">4 metrics per file</text>

  <!-- Arrow 2 -->
  <polygon points="1240,340 1290,310 1290,330 1390,330 1390,350 1290,350 1290,370" fill="#4ade80"/>

  <rect x="1420" y="200" width="400" height="280" rx="24" fill="url(#cardGrad)"/>
  <rect x="1420" y="200" width="400" height="8" rx="4" fill="#ffd93d"/>
  <text x="1620" y="300" font-family="Arial" font-size="64" fill="#ffd93d" text-anchor="middle">🏆</text>
  <text x="1620" y="380" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">Ranked Results</text>
  <text x="1620" y="430" font-family="Courier New" font-size="28" fill="#888" text-anchor="middle">Best first</text>

  <!-- Terminal mockup -->
  <rect x="200" y="550" width="1520" height="400" rx="16" fill="#0a0a14"/>
  <circle cx="240" cy="590" r="10" fill="#ff6b6b"/>
  <circle cx="275" cy="590" r="10" fill="#ffd93d"/>
  <circle cx="310" cy="590" r="10" fill="#4ade80"/>

  <text x="240" y="660" font-family="Courier New" font-size="32" fill="#888">$</text>
  <text x="280" y="660" font-family="Courier New" font-size="32" fill="#4ade80">rank-wav ./motifs --sort best</text>

  <text x="240" y="720" font-family="Courier New" font-size="28" fill="#00d4ff">┌──────────────────┬───────┬────────┬──────────┐</text>
  <text x="240" y="760" font-family="Courier New" font-size="28" fill="#00d4ff">│ File             │  RMS  │ Centroid│  Score  │</text>
  <text x="240" y="800" font-family="Courier New" font-size="28" fill="#00d4ff">├──────────────────┼───────┼────────┼──────────┤</text>
  <text x="240" y="840" font-family="Courier New" font-size="28" fill="#4ade80">│ motif_023.wav    │ 0.85  │  2.1k  │   0.92   │</text>
  <text x="240" y="880" font-family="Courier New" font-size="28" fill="#fff">│ motif_007.wav    │ 0.78  │  1.8k  │   0.87   │</text>
  <text x="240" y="920" font-family="Courier New" font-size="28" fill="#888">│ motif_041.wav    │ 0.71  │  2.4k  │   0.81   │</text>
</svg>
