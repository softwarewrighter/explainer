<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative -->
  <text x="100" y="180" font-size="100" opacity="0.15">🎵</text>
  <text x="1700" y="900" font-size="100" opacity="0.15">🏆</text>
  <circle cx="1800" cy="200" r="120" fill="#4ade80" opacity="0.06"/>
  <circle cx="120" cy="880" r="80" fill="#00d4ff" opacity="0.08"/>

  <!-- Headline -->
  <rect x="510" y="60" width="900" height="100" rx="50" fill="url(#accentGrad)" filter="url(#glow)"/>
  <text x="960" y="130" font-family="Arial Black, sans-serif" font-size="56"
        fill="#fff" text-anchor="middle">
    Stop Listening, Start Ranking
  </text>

  <!-- Summary cards -->
  <rect x="100" y="220" width="550" height="350" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="220" width="550" height="8" rx="4" fill="#4ade80"/>
  <text x="375" y="310" font-family="Arial" font-size="64" fill="#4ade80" text-anchor="middle">🔬</text>
  <text x="375" y="380" font-family="Arial Black" font-size="42" fill="#fff" text-anchor="middle">
    Acoustic Analysis
  </text>
  <text x="375" y="440" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    4 metrics per file
  </text>
  <text x="375" y="490" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    RMS, ZCR, Centroid, Bandwidth
  </text>

  <rect x="685" y="220" width="550" height="350" rx="24" fill="url(#cardGrad)"/>
  <rect x="685" y="220" width="550" height="8" rx="4" fill="#ffd93d"/>
  <text x="960" y="310" font-family="Arial" font-size="64" fill="#ffd93d" text-anchor="middle">⚖️</text>
  <text x="960" y="380" font-family="Arial Black" font-size="42" fill="#fff" text-anchor="middle">
    Smart Scoring
  </text>
  <text x="960" y="440" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    Two ranking modes
  </text>
  <text x="960" y="490" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    Pleasing vs Best
  </text>

  <rect x="1270" y="220" width="550" height="350" rx="24" fill="url(#cardGrad)"/>
  <rect x="1270" y="220" width="550" height="8" rx="4" fill="#00d4ff"/>
  <text x="1545" y="310" font-family="Arial" font-size="64" fill="#00d4ff" text-anchor="middle">⚡</text>
  <text x="1545" y="380" font-family="Arial Black" font-size="42" fill="#fff" text-anchor="middle">
    Pure Rust
  </text>
  <text x="1545" y="440" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    Fast and portable
  </text>
  <text x="1545" y="490" font-family="Arial" font-size="32" fill="#888" text-anchor="middle">
    No dependencies
  </text>

  <!-- Use cases -->
  <rect x="100" y="620" width="1720" height="340" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="620" width="1720" height="8" rx="4" fill="#ff6b6b"/>

  <text x="960" y="710" font-family="Arial Black" font-size="48" fill="#ff6b6b" text-anchor="middle">
    Perfect For
  </text>

  <text x="300" y="800" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">🎹</text>
  <text x="300" y="850" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">Synthesizers</text>
  <text x="300" y="900" font-family="Arial" font-size="28" fill="#888" text-anchor="middle">Parameter sweeps</text>

  <text x="620" y="800" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">🎚️</text>
  <text x="620" y="850" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">Sound Design</text>
  <text x="620" y="900" font-family="Arial" font-size="28" fill="#888" text-anchor="middle">Compare variants</text>

  <text x="960" y="800" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">📦</text>
  <text x="960" y="850" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">Sample Libraries</text>
  <text x="960" y="900" font-family="Arial" font-size="28" fill="#888" text-anchor="middle">Curate collections</text>

  <text x="1300" y="800" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">🤖</text>
  <text x="1300" y="850" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">Procedural Audio</text>
  <text x="1300" y="900" font-family="Arial" font-size="28" fill="#888" text-anchor="middle">Auto-triage batches</text>

  <text x="1620" y="800" font-family="Arial" font-size="36" fill="#fff" text-anchor="middle">🔧</text>
  <text x="1620" y="850" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">CI Pipelines</text>
  <text x="1620" y="900" font-family="Arial" font-size="28" fill="#888" text-anchor="middle">JSON integration</text>
</svg>
