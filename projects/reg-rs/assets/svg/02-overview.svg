<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative shapes -->
  <circle cx="100" cy="100" r="160" fill="#a855f7" opacity="0.06"/>
  <circle cx="1850" cy="200" r="140" fill="#00d4ff" opacity="0.05"/>
  <circle cx="300" cy="950" r="120" fill="#4ade80" opacity="0.06"/>
  <circle cx="1600" cy="950" r="100" fill="#ffd93d" opacity="0.05"/>

  <!-- Title -->
  <text x="960" y="90" text-anchor="middle" font-family="sans-serif" font-size="96" font-weight="bold" fill="#00d4ff" filter="url(#glow)">regress</text>
  <text x="960" y="145" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#aaa">Shell Aliases for Regression Testing</text>

  <!-- 2x2 Feature Grid -->
  <!-- Card 1: adrg - Add (top-left) -->
  <rect x="80" y="200" width="580" height="280" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="80" y="200" width="580" height="8" rx="4" fill="#a855f7"/>
  <text x="160" y="270" font-family="sans-serif" font-size="64">📦</text>
  <text x="230" y="270" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">adrg — Add</text>
  <text x="120" y="330" font-family="sans-serif" font-size="36" fill="#ccc">Capture baseline output</text>
  <text x="120" y="380" font-family="sans-serif" font-size="36" fill="#ccc">as git-friendly text files.</text>
  <text x="120" y="435" font-family="monospace" font-size="32" fill="#a855f7">adrg hello 'echo hi'</text>

  <!-- Card 2: rnrg - Run (top-right) -->
  <rect x="720" y="200" width="580" height="280" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="720" y="200" width="580" height="8" rx="4" fill="#00d4ff"/>
  <text x="800" y="270" font-family="sans-serif" font-size="64">🔍</text>
  <text x="870" y="270" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">rnrg — Run</text>
  <text x="760" y="330" font-family="sans-serif" font-size="36" fill="#ccc">Compare against baseline.</text>
  <text x="760" y="380" font-family="sans-serif" font-size="36" fill="#ccc">Inline diffs on failure.</text>
  <text x="760" y="435" font-family="monospace" font-size="32" fill="#00d4ff">rnrg hello -vv</text>

  <!-- Card 3: lsrg/shrg - List/Show (bottom-left) -->
  <rect x="80" y="520" width="580" height="280" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="80" y="520" width="580" height="8" rx="4" fill="#ffd93d"/>
  <text x="160" y="590" font-family="sans-serif" font-size="64">🎯</text>
  <text x="230" y="590" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">lsrg / shrg</text>
  <text x="120" y="650" font-family="sans-serif" font-size="36" fill="#ccc">List tests with status.</text>
  <text x="120" y="700" font-family="sans-serif" font-size="36" fill="#ccc">Show details and diffs.</text>
  <text x="120" y="755" font-family="monospace" font-size="32" fill="#ffd93d">shrg version_test -vv</text>

  <!-- Card 4: uprg - Rebase (bottom-right) -->
  <rect x="720" y="520" width="580" height="280" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="720" y="520" width="580" height="8" rx="4" fill="#4ade80"/>
  <text x="800" y="590" font-family="sans-serif" font-size="64">✓</text>
  <text x="870" y="590" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">uprg — Rebase</text>
  <text x="760" y="650" font-family="sans-serif" font-size="36" fill="#ccc">Accept new output as</text>
  <text x="760" y="700" font-family="sans-serif" font-size="36" fill="#ccc">the updated baseline.</text>
  <text x="760" y="755" font-family="monospace" font-size="32" fill="#4ade80">uprg version_test</text>

  <!-- Terminal mockup at bottom -->
  <rect x="80" y="860" width="1200" height="160" rx="16" fill="#0a0a14" stroke="#333" stroke-width="2"/>
  <!-- Window dots -->
  <circle cx="120" cy="895" r="8" fill="#ff6b6b"/>
  <circle cx="150" cy="895" r="8" fill="#ffd93d"/>
  <circle cx="180" cy="895" r="8" fill="#4ade80"/>
  <text x="240" y="898" font-family="monospace" font-size="36" fill="#aaa">Terminal</text>
  <!-- Command -->
  <text x="120" y="970" font-family="monospace" font-size="40" fill="#4ade80">$</text>
  <text x="160" y="970" font-family="monospace" font-size="40" fill="#eee"> rnrg api_ --parallel</text>

  <!-- Sparkle decorations -->
  <text x="1380" y="280" font-family="sans-serif" font-size="48" opacity="0.5">✨</text>
  <text x="1400" y="620" font-family="sans-serif" font-size="44" opacity="0.4">💡</text>
</svg>
