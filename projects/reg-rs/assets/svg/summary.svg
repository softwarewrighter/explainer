<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative shapes -->
  <circle cx="100" cy="150" r="180" fill="#a855f7" opacity="0.06"/>
  <circle cx="1800" cy="900" r="160" fill="#4ade80" opacity="0.05"/>
  <circle cx="960" cy="50" r="100" fill="#00d4ff" opacity="0.05"/>
  <circle cx="1850" cy="300" r="120" fill="#ffd93d" opacity="0.04"/>
  <polygon points="300,950 340,890 380,950" fill="#ff6b6b" opacity="0.07"/>
  <polygon points="1600,100 1640,40 1680,100" fill="#a855f7" opacity="0.06"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="sans-serif" font-size="96" font-weight="bold" fill="#00d4ff" filter="url(#glow)">25 Years of Regression Testing</text>
  <text x="960" y="160" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#aaa">From enterprise Java to open-source Rust</text>

  <!-- Timeline line -->
  <line x1="200" y1="380" x2="1600" y2="380" stroke="url(#timelineGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Timeline dots -->
  <circle cx="330" cy="380" r="16" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="910" cy="380" r="16" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="1490" cy="380" r="16" fill="#4ade80" filter="url(#glow)"/>

  <!-- Year labels above -->
  <text x="330" y="340" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#a855f7">before 2000</text>
  <text x="910" y="340" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#00d4ff">2001-2010+</text>
  <text x="1490" y="340" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#4ade80">2020-2026</text>

  <!-- Era 1: Forte Software -->
  <rect x="60" y="440" width="540" height="360" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="60" y="440" width="540" height="8" rx="4" fill="#a855f7"/>
  <text x="330" y="520" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">Forte Software</text>
  <text x="330" y="580" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">CLI testing tool</text>
  <text x="330" y="635" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">written in C++</text>

  <!-- Forte details -->
  <text x="120" y="710" font-family="sans-serif" font-size="36" fill="#a855f7">Built for QA teams</text>
  <text x="120" y="760" font-family="sans-serif" font-size="36" fill="#aaa">Testing Forte CLI tools</text>
  <!-- Icon -->
  <text x="500" y="770" font-family="sans-serif" font-size="56" opacity="0.5">⚙️</text>

  <!-- Era 2: Sun Microsystems -->
  <rect x="640" y="440" width="540" height="360" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="640" y="440" width="540" height="8" rx="4" fill="#00d4ff"/>
  <text x="910" y="520" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">Sun Microsystems</text>
  <text x="910" y="580" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">Java re-write used</text>
  <text x="910" y="635" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">at Sun and Oracle</text>

  <!-- Sun details -->
  <text x="700" y="710" font-family="sans-serif" font-size="36" fill="#00d4ff">Used by QA</text>
  <text x="700" y="760" font-family="sans-serif" font-size="36" fill="#aaa"></text>
  <!-- Icon -->
  <text x="1080" y="770" font-family="sans-serif" font-size="56" opacity="0.5">🏢</text>

  <!-- Era 3: Open Source Rust -->
  <rect x="1220" y="440" width="540" height="360" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="1220" y="440" width="540" height="8" rx="4" fill="#4ade80"/>
  <text x="1490" y="520" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#fff">Open Source</text>
  <text x="1490" y="580" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">Rewritten in Rust</text>
  <text x="1490" y="635" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ccc">for everyone</text>

  <!-- Rust details -->
  <text x="1280" y="710" font-family="sans-serif" font-size="36" fill="#4ade80">Fast and portable</text>
  <text x="1280" y="760" font-family="sans-serif" font-size="36" fill="#aaa">MIT Licensed</text>
  <!-- Rust crab -->
  <text x="1660" y="770" font-family="sans-serif" font-size="56" opacity="0.7">🦀</text>

  <!-- Bottom tagline -->
  <text x="700" y="920" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#ccc">Battle-tested concepts, modern implementation</text>

  <!-- Decorative emojis -->
  <text x="80" y="950" font-family="sans-serif" font-size="48" opacity="0.3">📜</text>
  <text x="700" y="1000" font-family="sans-serif" font-size="44" opacity="0.3">✨</text>
</svg>