<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="900" r="180" fill="#a855f7" opacity="0.06"/>
  <circle cx="960" cy="100" r="120" fill="#00d4ff" opacity="0.07"/>
  <circle cx="1800" cy="800" r="200" fill="#ff6b6b" opacity="0.05"/>
  <circle cx="400" cy="200" r="80" fill="#4ade80" opacity="0.06"/>

  <!-- Decorative polygon -->
  <polygon points="1700,50 1750,150 1650,150" fill="#ffd93d" opacity="0.08"/>
  <polygon points="100,400 140,340 180,400" fill="#00d4ff" opacity="0.08"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="bold" fill="#fff" filter="url(#glow)">The Problem &amp; The Solution</text>

  <!-- Divider arrow -->
  <line x1="960" y1="140" x2="960" y2="960" stroke="url(#arrowGrad)" stroke-width="3" stroke-dasharray="12,8" opacity="0.4"/>

  <!-- LEFT CARD: Problem -->
  <rect x="60" y="160" width="840" height="820" rx="24" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="60" y="160" width="840" height="10" rx="5" fill="#ff6b6b"/>

  <text x="480" y="240" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#ff6b6b">Tests Pass... But Output Changed</text>

  <!-- Problem scenario steps -->
  <text x="120" y="320" font-family="sans-serif" font-size="44" fill="#ffd93d">Step 1</text>
  <text x="120" y="370" font-family="sans-serif" font-size="40" fill="#eee">Ship a bug fix to your CLI tool</text>

  <!-- Arrow down -->
  <polygon points="460,400 500,400 480,440" fill="#aaa" opacity="0.6"/>

  <text x="120" y="490" font-family="sans-serif" font-size="44" fill="#ffd93d">Step 2</text>
  <text x="120" y="540" font-family="sans-serif" font-size="40" fill="#eee">All unit tests pass</text>
  <text x="680" y="540" font-family="sans-serif" font-size="44" fill="#4ade80">✓</text>

  <!-- Arrow down -->
  <polygon points="460,570 500,570 480,610" fill="#aaa" opacity="0.6"/>

  <text x="120" y="660" font-family="sans-serif" font-size="44" fill="#ffd93d">Step 3</text>
  <text x="120" y="710" font-family="sans-serif" font-size="40" fill="#eee">Customer reports broken flag</text>
  <text x="120" y="760" font-family="sans-serif" font-size="40" fill="#ff6b6b">Output silently changed</text>

  <!-- Warning emoji area -->
  <text x="480" y="880" text-anchor="middle" font-family="sans-serif" font-size="96" fill="#ffd93d" opacity="0.8">⚠️</text>
  <text x="480" y="950" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#aaa">No test caught it</text>

  <!-- RIGHT CARD: Solution -->
  <rect x="1020" y="160" width="840" height="820" rx="24" fill="url(#cardGrad)" opacity="0.9"/>
  <rect x="1020" y="160" width="840" height="10" rx="5" fill="#4ade80"/>

  <text x="1440" y="240" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#4ade80">Regression Testing</text>

  <!-- Solution steps -->
  <text x="1080" y="330" font-family="sans-serif" font-size="44" fill="#00d4ff">Step 1</text>
  <text x="1080" y="380" font-family="sans-serif" font-size="40" fill="#eee">Snapshot the actual output</text>
  <text x="1080" y="425" font-family="sans-serif" font-size="38" fill="#aaa">stdout, stderr, exit code</text>

  <!-- Arrow down -->
  <polygon points="1330,455 1370,455 1350,495" fill="#aaa" opacity="0.6"/>

  <text x="1080" y="540" font-family="sans-serif" font-size="44" fill="#00d4ff">Step 2</text>
  <text x="1080" y="590" font-family="sans-serif" font-size="40" fill="#eee">Compare on every re-run</text>
  <text x="1080" y="635" font-family="sans-serif" font-size="38" fill="#aaa">Automatic diff detection</text>

  <!-- Arrow down -->
  <polygon points="1330,665 1370,665 1350,705" fill="#aaa" opacity="0.6"/>

  <text x="1080" y="750" font-family="sans-serif" font-size="44" fill="#00d4ff">Step 3</text>
  <text x="1080" y="800" font-family="sans-serif" font-size="40" fill="#eee">Catch differences instantly</text>
  <text x="1080" y="845" font-family="sans-serif" font-size="38" fill="#4ade80">Before customers do</text>

  <!-- Checkmark emoji area -->
  <text x="1350" y="950" text-anchor="middle" font-family="sans-serif" font-size="96" fill="#4ade80" opacity="0.8">✅</text>
</svg>