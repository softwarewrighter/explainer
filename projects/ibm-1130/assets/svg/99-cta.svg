<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="180" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    Try It Yourself
  </text>

  <!-- Main CTA box -->
  <rect x="300" y="260" width="1320" height="200" rx="16"
        fill="#1e3a5f" stroke="#60a5fa" stroke-width="5"/>

  <text x="960" y="340" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0" text-anchor="middle">
    No installation required
  </text>
  <text x="960" y="420" font-family="Arial, sans-serif" font-size="42"
        fill="#60a5fa" text-anchor="middle">
    Link in description
  </text>

  <!-- Features -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0">
    Work through progressive challenges
  </text>

  <text x="400" y="640" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0">
    Master 1130 assembly step by step
  </text>

  <text x="400" y="720" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0">
    Understand how computers really work
  </text>

  <!-- Subscribe box -->
  <rect x="300" y="800" width="1320" height="140" rx="12"
        fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="960" y="890" font-family="Arial, sans-serif" font-size="48"
        fill="#f59e0b" text-anchor="middle">
    Like and Subscribe for more computing history
  </text>
</svg>
