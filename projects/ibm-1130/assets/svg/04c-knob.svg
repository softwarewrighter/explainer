<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="120" font-family="Arial, sans-serif" font-size="72"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Mode Selector Knob
  </text>

  <!-- Main content box -->
  <rect x="100" y="180" width="1720" height="400" rx="12"
        fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>

  <text x="960" y="260" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#f59e0b" text-anchor="middle">
    Execution Speed Control
  </text>

  <!-- Mode options -->
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#4ade80">
    RUN
  </text>
  <text x="450" y="350" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    Full speed execution
  </text>

  <text x="200" y="420" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#ec4899">
    SI
  </text>
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    Single Instruction, pause after each
  </text>

  <text x="200" y="490" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#60a5fa">
    SS
  </text>
  <text x="450" y="490" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    Single Step, one clock cycle at a time
  </text>

  <!-- Benefits box -->
  <rect x="100" y="620" width="1720" height="300" rx="12"
        fill="#1e3a5f" stroke="#4ade80" stroke-width="4"/>

  <text x="960" y="700" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    Why Slow Down?
  </text>

  <text x="200" y="780" font-family="Arial, sans-serif" font-size="36" fill="#f0f0f0">
    Watch registers change in real time
  </text>

  <text x="200" y="850" font-family="Arial, sans-serif" font-size="36" fill="#f0f0f0">
    Trace program execution step by step
  </text>

  <text x="1100" y="780" font-family="Arial, sans-serif" font-size="36" fill="#f0f0f0">
    Debug timing issues
  </text>

  <text x="1100" y="850" font-family="Arial, sans-serif" font-size="36" fill="#f0f0f0">
    Diagnose hardware faults
  </text>
</svg>
