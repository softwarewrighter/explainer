<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="180" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    A Computer That Taught Generations
  </text>

  <!-- Timeline box -->
  <rect x="200" y="260" width="1520" height="180" rx="12"
        fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>

  <text x="400" y="340" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#4ade80">
    1965
  </text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="42"
        fill="#e2e8f0">
    IBM releases the 1130 minicomputer
  </text>

  <!-- Key points -->
  <text x="260" y="540" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Small enough for universities
  </text>

  <text x="260" y="620" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Powerful enough for real science
  </text>

  <text x="260" y="700" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Now runs in your browser
  </text>

  <!-- Bottom highlight -->
  <rect x="200" y="800" width="1520" height="120" rx="12"
        fill="#1e3a5f" stroke="#60a5fa" stroke-width="4"/>
  <text x="960" y="875" font-family="Arial, sans-serif" font-size="48"
        fill="#4ade80" text-anchor="middle">
    Learn assembly the same way students did 60 years ago
  </text>
</svg>
