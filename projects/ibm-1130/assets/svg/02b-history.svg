<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background - will be replaced by Ken Burns montage -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Semi-transparent overlay for text readability -->
  <rect width="1920" height="1080" fill="#000" opacity="0.5"/>

  <!-- Title banner at top -->
  <rect x="0" y="60" width="1920" height="100" fill="#1e3a5f" opacity="0.9"/>
  <text x="960" y="130" font-family="Arial, sans-serif" font-size="64"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    The IBM 1130 Story
  </text>

  <!-- Key facts - positioned for Ken Burns overlay -->
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="72"
        font-weight="bold" fill="#4ade80">
    1965
  </text>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Breakthrough in affordable computing
  </text>

  <text x="100" y="450" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    16-bit word size
  </text>

  <text x="100" y="550" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    4,096 words of core memory
  </text>

  <text x="100" y="650" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Simple, powerful instruction set
  </text>

  <!-- Bottom stat -->
  <rect x="100" y="800" width="700" height="120" rx="12"
        fill="#1e3a5f" stroke="#4ade80" stroke-width="4"/>
  <text x="450" y="875" font-family="Arial, sans-serif" font-size="56"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    10,000+ systems installed
  </text>

  <!-- Price comparison box -->
  <rect x="980" y="400" width="840" height="420" rx="12"
        fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="1400" y="460" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#f59e0b" text-anchor="middle">
    Monthly Lease Comparison
  </text>
  <text x="1400" y="500" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    (1965 dollars)
  </text>

  <!-- IBM 1130 price -->
  <text x="1030" y="560" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#4ade80">
    IBM 1130
  </text>
  <text x="1770" y="560" font-family="Arial, sans-serif" font-size="36"
        fill="#4ade80" text-anchor="end">
    $695/mo
  </text>
  <text x="1030" y="600" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8">
    Basic system with 4K memory
  </text>

  <!-- System/360 Model 30 price -->
  <text x="1030" y="665" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#ec4899">
    System/360 Model 30
  </text>
  <text x="1770" y="665" font-family="Arial, sans-serif" font-size="36"
        fill="#ec4899" text-anchor="end">
    $2,700+/mo
  </text>
  <text x="1030" y="705" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8">
    Smallest mainframe option
  </text>

  <!-- PDP-8 price -->
  <text x="1030" y="770" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#60a5fa">
    DEC PDP-8
  </text>
  <text x="1770" y="770" font-family="Arial, sans-serif" font-size="36"
        fill="#60a5fa" text-anchor="end">
    $18,500
  </text>
  <text x="1030" y="805" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8">
    Purchase price, 12-bit</text>
</svg>
