<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="120" font-family="Arial, sans-serif" font-size="72"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Early Proof of Concept
  </text>

  <!-- Subtitle -->
  <text x="960" y="190" font-family="Arial, sans-serif" font-size="42"
        fill="#94a3b8" text-anchor="middle">
    What comes next for the IBM 1130 Emulator
  </text>

  <!-- Future Plans Box -->
  <rect x="100" y="240" width="1720" height="700" rx="12"
        fill="#0f172a" stroke="#4ade80" stroke-width="4"/>

  <text x="960" y="320" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    Future Development
  </text>

  <!-- Emulator Connections -->
  <rect x="150" y="370" width="500" height="200" rx="8"
        fill="#1e3a5f" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#f59e0b" text-anchor="middle">
    Emulator Integration
  </text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    Connect to real 1130
  </text>
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    emulators
  </text>

  <!-- More Devices -->
  <rect x="710" y="370" width="500" height="200" rx="8"
        fill="#1e3a5f" stroke="#ec4899" stroke-width="4"/>
  <text x="960" y="420" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#ec4899" text-anchor="middle">
    More Devices
  </text>
  <text x="960" y="480" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    Disk, tape, plotter,
  </text>
  <text x="960" y="530" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    card reader
  </text>

  <!-- Higher Level Languages -->
  <rect x="1270" y="370" width="500" height="200" rx="8"
        fill="#1e3a5f" stroke="#60a5fa" stroke-width="4"/>
  <text x="1520" y="420" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Languages
  </text>
  <text x="1520" y="480" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    APL, Forth, FORTRAN,
  </text>
  <text x="1520" y="530" font-family="Arial, sans-serif" font-size="32"
        fill="#f0f0f0" text-anchor="middle">
    RPG, COBOL
  </text>

  <!-- Bottom message -->
  <rect x="150" y="620" width="1620" height="280" rx="8"
        fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>

  <text x="960" y="700" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0" text-anchor="middle">
    This is just the beginning. The goal is to create an
  </text>
  <text x="960" y="760" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0" text-anchor="middle">
    interactive learning platform for vintage computing,
  </text>
  <text x="960" y="820" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0" text-anchor="middle">
    preserving the experience of programming these
  </text>
  <text x="960" y="880" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0" text-anchor="middle">
    remarkable machines.
  </text>
</svg>
