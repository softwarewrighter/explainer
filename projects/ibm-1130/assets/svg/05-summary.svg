<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="160" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Why the 1130 Still Matters
  </text>

  <!-- Key points -->
  <rect x="200" y="240" width="1520" height="600" rx="16"
        fill="#0f172a" stroke="#4ade80" stroke-width="5"/>

  <text x="280" y="340" font-family="Arial, sans-serif" font-size="48"
        fill="#4ade80">
    Taught assembly to thousands of students
  </text>

  <text x="280" y="440" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Clean architecture, perfect for learning
  </text>

  <text x="280" y="540" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Memory-mapped registers
  </text>

  <text x="280" y="640" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Single-address instruction format
  </text>

  <text x="280" y="740" font-family="Arial, sans-serif" font-size="48"
        fill="#f0f0f0">
    Condition flags for branching
  </text>

  <!-- Bottom highlight -->
  <text x="960" y="920" font-family="Arial, sans-serif" font-size="42"
        fill="#60a5fa" text-anchor="middle">
    These concepts still apply to modern processors
  </text>
</svg>
