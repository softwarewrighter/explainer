<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Retro scan lines effect -->
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>

  <!-- IBM badge -->
  <rect x="760" y="180" width="400" height="120" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="4"/>
  <text x="960" y="260" font-family="Arial, sans-serif" font-size="72"
        font-weight="bold" fill="#fff" text-anchor="middle">
    IBM
  </text>

  <!-- Main title -->
  <text x="960" y="450" font-family="Arial, sans-serif" font-size="144"
        font-weight="bold" fill="#f0f0f0" text-anchor="middle"
        stroke="#3b82f6" stroke-width="3">
    1130
  </text>

  <!-- Subtitle -->
  <text x="960" y="580" font-family="Arial, sans-serif" font-size="64"
        fill="#60a5fa" text-anchor="middle">
    Assembly Emulator
  </text>

  <!-- Tagline -->
  <text x="960" y="720" font-family="Arial, sans-serif" font-size="42"
        fill="#94a3b8" text-anchor="middle">
    Learn 1965 Computing in Your Browser
  </text>

  <!-- Era badge -->
  <text x="960" y="880" font-family="'Courier New', monospace" font-size="36"
        fill="#4ade80" text-anchor="middle">
    16-bit Minicomputer Era
  </text>
</svg>
