<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="200" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Live Demo
  </text>

  <!-- Subtitle -->
  <text x="960" y="300" font-family="Arial, sans-serif" font-size="48"
        fill="#4ade80" text-anchor="middle">
    Interactive Assembly Challenges
  </text>

  <!-- Layout preview boxes -->
  <rect x="200" y="380" width="400" height="280" rx="12"
        fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#f59e0b" text-anchor="middle">
    CPU State
  </text>
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Registers
  </text>
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Memory
  </text>
  <text x="400" y="610" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Flags
  </text>

  <rect x="660" y="380" width="600" height="280" rx="12"
        fill="#0f172a" stroke="#4ade80" stroke-width="4"/>
  <text x="960" y="440" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    Code Editor
  </text>
  <text x="960" y="510" font-family="'Courier New', monospace" font-size="28"
        fill="#f0f0f0" text-anchor="middle">
    LD   100
  </text>
  <text x="960" y="560" font-family="'Courier New', monospace" font-size="28"
        fill="#f0f0f0" text-anchor="middle">
    A    101
  </text>
  <text x="960" y="610" font-family="'Courier New', monospace" font-size="28"
        fill="#f0f0f0" text-anchor="middle">
    STO  102
  </text>

  <rect x="1320" y="380" width="400" height="280" rx="12"
        fill="#0f172a" stroke="#ec4899" stroke-width="4"/>
  <text x="1520" y="440" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#ec4899" text-anchor="middle">
    Challenges
  </text>
  <text x="1520" y="510" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Basic Loads
  </text>
  <text x="1520" y="560" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Arithmetic
  </text>
  <text x="1520" y="610" font-family="Arial, sans-serif" font-size="28"
        fill="#94a3b8" text-anchor="middle">
    Index Addressing
  </text>

  <!-- Bottom text -->
  <text x="960" y="780" font-family="Arial, sans-serif" font-size="42"
        fill="#f0f0f0" text-anchor="middle">
    Step through instructions and watch the CPU respond
  </text>

  <text x="960" y="860" font-family="Arial, sans-serif" font-size="36"
        fill="#60a5fa" text-anchor="middle">
    Progressive challenges guide your learning
  </text>
</svg>
