<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="140" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#60a5fa" text-anchor="middle">
    Web Emulator Demo
  </text>

  <!-- Two examples preview -->
  <text x="960" y="220" font-family="Arial, sans-serif" font-size="42"
        fill="#94a3b8" text-anchor="middle">
    Two Examples: Basic Arithmetic and Memory-Mapped Registers
  </text>

  <!-- Example 1 box -->
  <rect x="100" y="280" width="820" height="340" rx="12"
        fill="#0f172a" stroke="#4ade80" stroke-width="4"/>
  <text x="510" y="340" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#4ade80" text-anchor="middle">
    Example 1: Add Two Numbers
  </text>

  <text x="150" y="410" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">LD  0 30   ; Load 5</text>
  <text x="150" y="460" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">A   0 31   ; Add 7</text>
  <text x="150" y="510" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">STO 0 32   ; Store 12</text>
  <text x="150" y="560" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">WAIT       ; Halt</text>

  <!-- Example 2 box -->
  <rect x="1000" y="280" width="820" height="340" rx="12"
        fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="1410" y="340" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#f59e0b" text-anchor="middle">
    Example 2: Index Registers
  </text>

  <text x="1050" y="410" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">STO 0 1    ; Set XR1</text>
  <text x="1050" y="460" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">STO 0 2    ; Set XR2</text>
  <text x="1050" y="510" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">STO 0 3    ; Set XR3</text>
  <text x="1050" y="560" font-family="'Courier New', monospace" font-size="32" fill="#f0f0f0">LD  1 50   ; Indexed load</text>

  <!-- UI Elements description -->
  <rect x="100" y="680" width="1720" height="280" rx="12"
        fill="#1e3a5f" stroke="#60a5fa" stroke-width="4"/>

  <text x="200" y="750" font-family="Arial, sans-serif" font-size="36"
        font-weight="bold" fill="#60a5fa">
    Watch for:
  </text>

  <text x="200" y="820" font-family="Arial, sans-serif" font-size="32" fill="#f0f0f0">
    Accumulator updating as instructions execute
  </text>
  <text x="200" y="870" font-family="Arial, sans-serif" font-size="32" fill="#f0f0f0">
    Memory grid highlighting active addresses
  </text>
  <text x="200" y="920" font-family="Arial, sans-serif" font-size="32" fill="#f0f0f0">
    Index registers at memory locations 1, 2, 3 changing values
  </text>
</svg>
