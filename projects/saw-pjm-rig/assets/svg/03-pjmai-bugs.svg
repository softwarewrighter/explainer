<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative -->
  <circle cx="1800" cy="200" r="250" fill="#ff6b6b" opacity="0.06"/>
  <circle cx="150" cy="850" r="200" fill="#4ade80" opacity="0.06"/>

  <!-- Headline -->
  <text x="960" y="120" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#f5a623" text-anchor="middle" filter="url(#glow)">
    pjmai-rs: Fixing the Foundation
  </text>
  <text x="960" y="180" font-family="Arial, sans-serif" font-size="48"
        fill="#aaa" text-anchor="middle">
    Rust 2024 Edition + Shell Integration
  </text>

  <!-- Bug fix card -->
  <rect x="100" y="230" width="840" height="380" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="230" width="840" height="8" rx="4" fill="#ff6b6b"/>
  <text x="170" y="310" font-size="48" opacity="0.9">&#x1F41B;</text>
  <text x="230" y="310" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#ff6b6b">Critical Bug Fix</text>

  <!-- Terminal showing the bug -->
  <rect x="140" y="340" width="760" height="240" rx="12" fill="#0a0a14"/>
  <circle cx="175" cy="375" r="8" fill="#ff6b6b"/>
  <circle cx="205" cy="375" r="8" fill="#ffd93d"/>
  <circle cx="235" cy="375" r="8" fill="#4ade80"/>
  <text x="175" y="425" font-family="Courier New, monospace" font-size="36" fill="#ff6b6b">
    // Rust 2024 broke remove()
  </text>
  <text x="175" y="475" font-family="Courier New, monospace" font-size="36" fill="#888">
    - projects.remove(name)  // old
  </text>
  <text x="175" y="525" font-family="Courier New, monospace" font-size="36" fill="#4ade80">
    + projects.shift_remove(name)
  </text>

  <!-- Features card -->
  <rect x="980" y="230" width="840" height="380" rx="24" fill="url(#cardGrad)"/>
  <rect x="980" y="230" width="840" height="8" rx="4" fill="#4ade80"/>
  <text x="1050" y="310" font-size="48" opacity="0.9">&#x2699;</text>
  <text x="1110" y="310" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80">Shell Improvements</text>

  <text x="1040" y="380" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Fixed help flag for aliases
  </text>
  <text x="1040" y="440" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Added after_help to all cmds
  </text>
  <text x="1040" y="500" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Version flag now matches
  </text>
  <text x="1040" y="560" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Arg validation for flags
  </text>

  <!-- Bottom: New capabilities -->
  <rect x="100" y="660" width="1720" height="360" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="660" width="1720" height="8" rx="4" fill="#00d4ff"/>
  <text x="170" y="740" font-size="48" opacity="0.9">&#x1F680;</text>
  <text x="240" y="740" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#00d4ff">New Capabilities</text>

  <!-- Pill/chip elements for features -->
  <rect x="160" y="780" width="360" height="70" rx="35" fill="#1a3a2e" stroke="#4ade80" stroke-width="4"/>
  <text x="340" y="828" font-family="Arial, sans-serif" font-size="40"
        fill="#4ade80" text-anchor="middle">Stack Navigation</text>

  <rect x="560" y="780" width="340" height="70" rx="35" fill="#3a2a1a" stroke="#f5a623" stroke-width="4"/>
  <text x="730" y="828" font-family="Arial, sans-serif" font-size="40"
        fill="#f5a623" text-anchor="middle">History Track</text>

  <rect x="940" y="780" width="380" height="70" rx="35" fill="#2a1a3a" stroke="#a855f7" stroke-width="4"/>
  <text x="1130" y="828" font-family="Arial, sans-serif" font-size="40"
        fill="#a855f7" text-anchor="middle">Fuzzy Completion</text>

  <rect x="1360" y="780" width="400" height="70" rx="35" fill="#1a2a3a" stroke="#00d4ff" stroke-width="4"/>
  <text x="1560" y="828" font-family="Arial, sans-serif" font-size="40"
        fill="#00d4ff" text-anchor="middle">Environment Config</text>

  <rect x="160" y="880" width="340" height="70" rx="35" fill="#1a3a2e" stroke="#4ade80" stroke-width="4"/>
  <text x="330" y="928" font-family="Arial, sans-serif" font-size="40"
        fill="#4ade80" text-anchor="middle">Auto Detection</text>

  <rect x="540" y="880" width="340" height="70" rx="35" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="4"/>
  <text x="710" y="928" font-family="Arial, sans-serif" font-size="40"
        fill="#ff6b6b" text-anchor="middle">Bulk Operations</text>

  <rect x="920" y="880" width="360" height="70" rx="35" fill="#3a2a1a" stroke="#ffd93d" stroke-width="4"/>
  <text x="1100" y="928" font-family="Arial, sans-serif" font-size="40"
        fill="#ffd93d" text-anchor="middle">Subdir Navigation</text>

  <rect x="1320" y="880" width="380" height="70" rx="35" fill="#2a1a3a" stroke="#a855f7" stroke-width="4"/>
  <text x="1510" y="928" font-family="Arial, sans-serif" font-size="40"
        fill="#a855f7" text-anchor="middle">User Guide + Docs</text>
</svg>
