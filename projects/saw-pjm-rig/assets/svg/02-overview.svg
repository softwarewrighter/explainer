<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative -->
  <circle cx="100" cy="100" r="180" fill="#00d4ff" opacity="0.05"/>
  <circle cx="1850" cy="950" r="220" fill="#f5a623" opacity="0.05"/>

  <!-- Headline -->
  <text x="960" y="120" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">
    What We Cover Today
  </text>

  <!-- Three columns -->
  <!-- Column 1: pjmai-rs -->
  <rect x="80" y="200" width="560" height="780" rx="24" fill="url(#cardGrad)"/>
  <rect x="80" y="200" width="560" height="8" rx="4" fill="#f5a623"/>
  <text x="360" y="290" font-size="64" text-anchor="middle" opacity="0.9">&#x1F527;</text>
  <text x="360" y="360" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#f5a623" text-anchor="middle">pjmai-rs</text>
  <text x="360" y="420" font-family="Arial, sans-serif" font-size="40"
        fill="#aaa" text-anchor="middle">Bug Fixes + Features</text>
  <line x1="140" y1="450" x2="580" y2="450" stroke="#333" stroke-width="4"/>
  <text x="140" y="510" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Rust 2024 edition fix</text>
  <text x="140" y="570" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Stack navigation</text>
  <text x="140" y="630" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; History tracking</text>
  <text x="140" y="690" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Fuzzy completion</text>
  <text x="140" y="750" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Environment config</text>
  <text x="140" y="810" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Auto detection</text>
  <text x="140" y="870" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; User guide and docs</text>

  <!-- Column 2: Rig -->
  <rect x="680" y="200" width="560" height="780" rx="24" fill="url(#cardGrad)"/>
  <rect x="680" y="200" width="560" height="8" rx="4" fill="#4ade80"/>
  <text x="960" y="290" font-size="64" text-anchor="middle" opacity="0.9">&#x1F916;</text>
  <text x="960" y="360" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80" text-anchor="middle">Rig Framework</text>
  <text x="960" y="420" font-family="Arial, sans-serif" font-size="40"
        fill="#aaa" text-anchor="middle">AI Agents in Rust</text>
  <line x1="740" y1="450" x2="1180" y2="450" stroke="#333" stroke-width="4"/>
  <text x="740" y="510" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Unified LLM A P I</text>
  <text x="740" y="570" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Type safe agents</text>
  <text x="740" y="630" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Vector store support</text>
  <text x="740" y="690" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Low memory footprint</text>
  <text x="740" y="750" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Embeddings built in</text>

  <!-- Column 3: langchain-rust -->
  <rect x="1280" y="200" width="560" height="780" rx="24" fill="url(#cardGrad)"/>
  <rect x="1280" y="200" width="560" height="8" rx="4" fill="#a855f7"/>
  <text x="1560" y="290" font-size="64" text-anchor="middle" opacity="0.9">&#x1F517;</text>
  <text x="1560" y="360" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#a855f7" text-anchor="middle">langchain-rust</text>
  <text x="1560" y="420" font-family="Arial, sans-serif" font-size="40"
        fill="#aaa" text-anchor="middle">LLM Chains in Rust</text>
  <line x1="1340" y1="450" x2="1780" y2="450" stroke="#333" stroke-width="4"/>
  <text x="1340" y="510" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Chain abstractions</text>
  <text x="1340" y="570" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Agent systems</text>
  <text x="1340" y="630" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Document loaders</text>
  <text x="1340" y="690" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Vector databases</text>
  <text x="1340" y="750" font-family="Arial, sans-serif" font-size="40" fill="#eee">&#x2713; Semantic routing</text>
</svg>
