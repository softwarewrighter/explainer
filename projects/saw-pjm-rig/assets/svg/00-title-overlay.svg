<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="8" dy="8" in="SourceAlpha" result="offset1"/>
      <feFlood flood-color="#000000" flood-opacity="0.95"/>
      <feComposite in2="offset1" operator="in" result="shadow1"/>
      <feOffset dx="4" dy="4" in="SourceAlpha" result="offset2"/>
      <feFlood flood-color="#111111" flood-opacity="0.8"/>
      <feComposite in2="offset2" operator="in" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main title: "Sharpen The Saw" arcing over center -->
  <g filter="url(#shadow3d)">
    <!-- Black outline layer -->
    <text x="110" y="480" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="14"
          letter-spacing="4" transform="rotate(-6, 350, 450)">Sharpen</text>
    <text x="780" y="350" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="14"
          letter-spacing="4">The</text>
    <text x="1130" y="480" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="14"
          letter-spacing="4" transform="rotate(6, 1300, 450)">Saw</text>

    <!-- Bright fill layer -->
    <text x="110" y="480" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="#f0e68c" stroke="#000000" stroke-width="5"
          letter-spacing="4" transform="rotate(-6, 350, 450)">Sharpen</text>
    <text x="780" y="350" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="#fffacd" stroke="#000000" stroke-width="5"
          letter-spacing="4">The</text>
    <text x="1130" y="480" font-family="Arial Black, sans-serif" font-size="136"
          font-weight="bold" fill="#f0e68c" stroke="#000000" stroke-width="5"
          letter-spacing="4" transform="rotate(6, 1300, 450)">Saw</text>
  </g>

  <!-- Subtitle -->
  <g filter="url(#shadow3d)">
    <text x="960" y="720" font-family="Arial, Helvetica, sans-serif" font-size="64"
          font-weight="bold" fill="none" stroke="#000000" stroke-width="10"
          text-anchor="middle" letter-spacing="3">
      Project Management, Rust AI Crates
    </text>
    <text x="960" y="720" font-family="Arial, Helvetica, sans-serif" font-size="64"
          font-weight="bold" fill="#ffffff" stroke="#000000" stroke-width="3"
          text-anchor="middle" letter-spacing="3">
      Project Management, Rust AI Crates
    </text>
  </g>

  <!-- Decorative sparkles -->
  <text x="80" y="310" font-size="48" opacity="0.85" filter="url(#glow)">&#x2728;</text>
  <text x="1800" y="310" font-size="48" opacity="0.85" filter="url(#glow)">&#x2728;</text>
  <text x="200" y="230" font-size="40" opacity="0.6">&#x2B50;</text>
  <text x="1680" y="230" font-size="40" opacity="0.6">&#x2B50;</text>
  <text x="350" y="580" font-size="36" opacity="0.5">&#x2728;</text>
  <text x="1530" y="580" font-size="36" opacity="0.5">&#x2728;</text>
</svg>
