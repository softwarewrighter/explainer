<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
    <radialGradient id="rigGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative glow -->
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#rigGlow)"/>
  <circle cx="150" cy="200" r="200" fill="#4ade80" opacity="0.05"/>
  <circle cx="1800" cy="800" r="180" fill="#a855f7" opacity="0.06"/>

  <!-- Headline -->
  <text x="960" y="110" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#4ade80" text-anchor="middle" filter="url(#glow)">
    Rig: AI Agents in Rust
  </text>
  <text x="960" y="175" font-family="Arial, sans-serif" font-size="48"
        fill="#aaa" text-anchor="middle">
    rig.rs, A Type Safe Framework
  </text>

  <!-- Left: What Rig provides -->
  <rect x="80" y="220" width="880" height="780" rx="24" fill="url(#cardGrad)"/>
  <rect x="80" y="220" width="880" height="8" rx="4" fill="#4ade80"/>
  <text x="150" y="310" font-size="48" opacity="0.9">&#x1F916;</text>
  <text x="220" y="310" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80">Core Features</text>

  <text x="150" y="390" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Unified A P I for LLM providers
  </text>
  <text x="150" y="455" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; OpenAI, Anthropic, Cohere
  </text>
  <text x="150" y="520" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Compile time type safety
  </text>
  <text x="150" y="585" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Async agents with tools
  </text>
  <text x="150" y="650" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Vector store integration
  </text>
  <text x="150" y="715" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Embeddings support
  </text>

  <!-- Code snippet -->
  <rect x="120" y="760" width="800" height="210" rx="12" fill="#0a0a14"/>
  <circle cx="155" cy="795" r="8" fill="#ff6b6b"/>
  <circle cx="185" cy="795" r="8" fill="#ffd93d"/>
  <circle cx="215" cy="795" r="8" fill="#4ade80"/>
  <text x="155" y="845" font-family="Courier New, monospace" font-size="36" fill="#a855f7">let agent = openai_client</text>
  <text x="155" y="890" font-family="Courier New, monospace" font-size="36" fill="#eee">  .agent("gpt-4o")</text>
  <text x="155" y="935" font-family="Courier New, monospace" font-size="36" fill="#eee">  .tool(Calculator).build();</text>

  <!-- Right: Performance comparison -->
  <rect x="1000" y="220" width="840" height="380" rx="24" fill="url(#cardGrad)"/>
  <rect x="1000" y="220" width="840" height="8" rx="4" fill="#ffd93d"/>
  <text x="1070" y="310" font-size="48" opacity="0.9">&#x26A1;</text>
  <text x="1140" y="310" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#ffd93d">Performance Edge</text>

  <text x="1060" y="390" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    Memory: five times less than Python
  </text>
  <text x="1060" y="450" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    CPU: twenty four percent average
  </text>
  <text x="1060" y="510" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    No garbage collector overhead
  </text>
  <text x="1060" y="570" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    Immediate memory deallocation
  </text>

  <!-- Right bottom: Why explore -->
  <rect x="1000" y="640" width="840" height="360" rx="24" fill="url(#cardGrad)"/>
  <rect x="1000" y="640" width="840" height="8" rx="4" fill="#a855f7"/>
  <text x="1070" y="730" font-size="48" opacity="0.9">&#x1F52D;</text>
  <text x="1140" y="730" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#a855f7">Why Explore Rig</text>

  <text x="1060" y="810" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Build agents for pjmai-rs
  </text>
  <text x="1060" y="875" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Replace custom HTTP calls
  </text>
  <text x="1060" y="940" font-family="Arial, sans-serif" font-size="44" fill="#eee">
    &#x2713; Type safe LLM interactions
  </text>
</svg>
