<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0221"/>
      <stop offset="100%" style="stop-color:#150734"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="300" font-family="Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#01cdfe" text-anchor="middle">
    Scaling Up
  </text>

  <!-- Subtitle -->
  <text x="960" y="450" font-family="Arial, sans-serif" font-size="56"
        fill="#05ffa1" text-anchor="middle">
    9 Scouts on a Larger Grid
  </text>

  <!-- Details -->
  <text x="960" y="600" font-family="Arial, sans-serif" font-size="42"
        fill="#aaa" text-anchor="middle">
    Grid Size: 6x6
  </text>
  <text x="960" y="680" font-family="Arial, sans-serif" font-size="42"
        fill="#aaa" text-anchor="middle">
    Episodes: 70
  </text>

  <text x="960" y="850" font-family="Arial, sans-serif" font-size="48"
        fill="#ff71ce" text-anchor="middle">
    More scouts handle harder problems
  </text>
</svg>
