<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0221"/>
      <stop offset="100%" style="stop-color:#150734"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#01cdfe" text-anchor="middle">
    How It Works
  </text>

  <!-- Scout boxes (left side) -->
  <rect x="100" y="180" width="400" height="120" rx="12"
        fill="#0a0a1a" stroke="#ff9f1c" stroke-width="5"/>
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#ff9f1c" text-anchor="middle">
    Random Scout
  </text>

  <rect x="100" y="330" width="400" height="120" rx="12"
        fill="#0a0a1a" stroke="#05ffa1" stroke-width="5"/>
  <text x="300" y="400" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#05ffa1" text-anchor="middle">
    Epsilon Scout
  </text>

  <rect x="100" y="480" width="400" height="120" rx="12"
        fill="#0a0a1a" stroke="#b967ff" stroke-width="5"/>
  <text x="300" y="550" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#b967ff" text-anchor="middle">
    Curious Scout
  </text>

  <rect x="100" y="630" width="400" height="120" rx="12"
        fill="#0a0a1a" stroke="#ff71ce" stroke-width="5"/>
  <text x="300" y="700" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#ff71ce" text-anchor="middle">
    Optimistic Scout
  </text>

  <!-- Arrows to aggregator -->
  <line x1="500" y1="240" x2="700" y2="420" stroke="#aaa" stroke-width="4"/>
  <line x1="500" y1="390" x2="700" y2="420" stroke="#aaa" stroke-width="4"/>
  <line x1="500" y1="540" x2="700" y2="450" stroke="#aaa" stroke-width="4"/>
  <line x1="500" y1="690" x2="700" y2="480" stroke="#aaa" stroke-width="4"/>

  <!-- Experience Aggregator (center) -->
  <rect x="700" y="340" width="500" height="220" rx="16"
        fill="#0a0a1a" stroke="#01cdfe" stroke-width="6"/>
  <text x="950" y="420" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#01cdfe" text-anchor="middle">
    Experience Pool
  </text>
  <text x="950" y="490" font-family="Arial, sans-serif" font-size="36"
        fill="#aaa" text-anchor="middle">
    Aggregated trajectories
  </text>
  <text x="950" y="540" font-family="Arial, sans-serif" font-size="36"
        fill="#aaa" text-anchor="middle">
    from all scouts
  </text>

  <!-- Arrow to learner -->
  <polygon points="1250,450 1300,420 1300,480" fill="#ff71ce"/>
  <line x1="1200" y1="450" x2="1300" y2="450" stroke="#ff71ce" stroke-width="6"/>

  <!-- Shared Learner (right) -->
  <rect x="1350" y="300" width="450" height="300" rx="16"
        fill="#0a0a1a" stroke="#05ffa1" stroke-width="6"/>
  <text x="1575" y="400" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#05ffa1" text-anchor="middle">
    Shared Learner
  </text>
  <text x="1575" y="470" font-family="Arial, sans-serif" font-size="36"
        fill="#aaa" text-anchor="middle">
    DQN with
  </text>
  <text x="1575" y="520" font-family="Arial, sans-serif" font-size="36"
        fill="#aaa" text-anchor="middle">
    target network
  </text>
  <text x="1575" y="580" font-family="Arial, sans-serif" font-size="36"
        fill="#aaa" text-anchor="middle">
    Updates policy
  </text>

  <!-- Feedback arrow -->
  <path d="M 1575 620 L 1575 800 L 300 800 L 300 760"
        fill="none" stroke="#aaa" stroke-width="3" stroke-dasharray="10,5"/>
  <polygon points="300,760 280,800 320,800" fill="#aaa"/>
  <text x="960" y="840" font-family="Arial, sans-serif" font-size="32"
        fill="#666" text-anchor="middle">
    Policy updates flow back to scouts
  </text>

  <!-- Avatar safe zone (bottom right 220x220) -->
</svg>
