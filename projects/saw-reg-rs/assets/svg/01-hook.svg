<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="120" fill="#f5a623" opacity="0.05"/>
  <circle cx="1700" cy="900" r="180" fill="#4ade80" opacity="0.04"/>
  <circle cx="960" cy="100" r="80" fill="#a855f7" opacity="0.06"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#ffffff" filter="url(#glow)">Why Sharpen the Saw?</text>

  <!-- Subtitle -->
  <text x="960" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#a0a0d0">Three tools, three problems, three upgrades</text>

  <!-- Left card: The Problem -->
  <rect x="80" y="220" width="840" height="740" rx="24" fill="url(#cardGrad)"/>
  <rect x="80" y="220" width="840" height="8" rx="4" fill="#ff6b6b"/>

  <text x="500" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="bold" fill="#ff6b6b">The Problem</text>

  <!-- Problem items -->
  <text x="140" y="410" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#ff6b6b">✗</text>
  <text x="190" y="410" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Binary files git can't diff</text>
  <text x="190" y="460" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">PRs show nothing useful</text>

  <line x1="140" y1="500" x2="860" y2="500" stroke="#3a3a5e" stroke-width="4"/>

  <text x="140" y="560" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#ff6b6b">✗</text>
  <text x="190" y="560" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Context lost mid-session</text>
  <text x="190" y="610" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Auto-compaction drops decisions</text>

  <line x1="140" y1="650" x2="860" y2="650" stroke="#3a3a5e" stroke-width="4"/>

  <text x="140" y="710" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#ff6b6b">✗</text>
  <text x="190" y="710" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Agents repeat same mistakes</text>
  <text x="190" y="760" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Same mistakes, every session</text>

  <!-- Emoji decoration -->
  <text x="780" y="900" font-family="sans-serif" font-size="64" opacity="0.3">🔴</text>

  <!-- Right card: The Fix -->
  <rect x="1000" y="220" width="840" height="740" rx="24" fill="url(#cardGrad)"/>
  <rect x="1000" y="220" width="840" height="8" rx="4" fill="#4ade80"/>

  <text x="1420" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="bold" fill="#4ade80">The Fix</text>

  <!-- Fix items -->
  <text x="1060" y="410" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#4ade80">✓</text>
  <text x="1110" y="410" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Git-friendly text files</text>
  <text x="1110" y="460" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">.rgt + .out + .err in version control</text>

  <line x1="1060" y1="500" x2="1780" y2="500" stroke="#3a3a5e" stroke-width="4"/>

  <text x="1060" y="560" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#4ade80">✓</text>
  <text x="1110" y="560" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Structured handoffs</text>
  <text x="1110" y="610" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Sagas, steps, explicit context</text>

  <line x1="1060" y1="650" x2="1780" y2="650" stroke="#3a3a5e" stroke-width="4"/>

  <text x="1060" y="710" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#4ade80">✓</text>
  <text x="1110" y="710" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Learn from success</text>
  <text x="1110" y="760" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Trajectory recording + injection</text>

  <!-- Emoji decoration -->
  <text x="1700" y="900" font-family="sans-serif" font-size="64" opacity="0.3">✅</text>

  <!-- Bottom arrow -->
  <text x="945" y="620" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#ffd93d" opacity="0.7">→</text>
</svg>
