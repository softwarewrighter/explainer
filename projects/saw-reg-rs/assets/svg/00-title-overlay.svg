<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="1.0"/>
    </filter>
  </defs>

  <!-- Left side: "Sharpen / The / Saw" -->
  <g filter="url(#shadowHeavy)">
    <text x="120" y="340" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="6" paint-order="stroke fill">Sharpen</text>
    <text x="120" y="520" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="6" paint-order="stroke fill">The</text>
    <text x="120" y="700" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="6" paint-order="stroke fill">Saw</text>
  </g>

  <!-- Right side: "Testing / Context / Guidance" -->
  <g filter="url(#shadowHeavy)">
    <text x="1800" y="340" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="5" paint-order="stroke fill"
          text-anchor="end">Testing</text>
    <text x="1800" y="480" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="5" paint-order="stroke fill"
          text-anchor="end">Context</text>
    <text x="1800" y="620" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="900"
          fill="#FF8C00" stroke="#000000" stroke-width="5" paint-order="stroke fill"
          text-anchor="end">Guidance</text>
  </g>

  <!-- Subtle series label at bottom -->
  <text x="960" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700"
        fill="#FF8C00" stroke="#000000" stroke-width="3" paint-order="stroke fill"
        text-anchor="middle" filter="url(#shadow)" opacity="0.85">(2/?)</text>
</svg>
