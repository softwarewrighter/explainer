<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="300" cy="900" r="140" fill="#a855f7" opacity="0.05"/>
  <circle cx="1650" cy="150" r="100" fill="#ff6b6b" opacity="0.04"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#ffffff" filter="url(#glow)">agentrail-rs</text>
  <text x="960" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#a855f7">In-Context Reinforcement Learning</text>

  <!-- Left: Predicting What Works (narrower - 680px) -->
  <rect x="60" y="210" width="680" height="480" rx="24" fill="url(#cardGrad)"/>
  <rect x="60" y="210" width="680" height="8" rx="4" fill="#ff6b6b"/>

  <text x="400" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#ff6b6b">Predicting What Works</text>

  <!-- Failure flow -->
  <rect x="110" y="340" width="200" height="80" rx="12" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="4"/>
  <text x="210" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#ff6b6b">Try task</text>

  <polygon points="325,370 325,390 360,380" fill="#ff6b6b"/>

  <rect x="370" y="340" width="170" height="80" rx="12" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="4"/>
  <text x="455" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#ff6b6b">Fail ✗</text>

  <polygon points="555,370 555,390 590,380" fill="#ffd93d"/>

  <rect x="600" y="340" width="120" height="80" rx="12" fill="#0a1a0a" stroke="#ffd93d" stroke-width="4"/>
  <text x="660" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#ffd93d">Retry</text>

  <text x="400" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#e0e0ff">Wrong flags, skipped validation,</text>
  <text x="400" y="535" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#e0e0ff">missed steps. Every session.</text>

  <text x="400" y="630" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="72" fill="#ff6b6b" opacity="0.15">🔄 🔄 🔄</text>

  <!-- Right: Showing What Worked (wider - 1080px) -->
  <rect x="780" y="210" width="1080" height="480" rx="24" fill="url(#cardGrad)"/>
  <rect x="780" y="210" width="1080" height="8" rx="4" fill="#4ade80"/>

  <text x="1320" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#4ade80">Showing What Worked</text>

  <!-- Success flow: state → action → result → reward -->
  <rect x="840" y="340" width="200" height="70" rx="10" fill="#0a0a14" stroke="#a855f7" stroke-width="4"/>
  <text x="940" y="385" text-anchor="middle" font-family="monospace" font-size="28" fill="#a855f7">state</text>

  <polygon points="1050,370 1050,380 1080,375" fill="#a855f7"/>

  <rect x="1090" y="340" width="200" height="70" rx="10" fill="#0a0a14" stroke="#a855f7" stroke-width="4"/>
  <text x="1190" y="385" text-anchor="middle" font-family="monospace" font-size="28" fill="#a855f7">action</text>

  <polygon points="1300,370 1300,380 1330,375" fill="#a855f7"/>

  <rect x="1340" y="340" width="200" height="70" rx="10" fill="#0a0a14" stroke="#a855f7" stroke-width="4"/>
  <text x="1440" y="385" text-anchor="middle" font-family="monospace" font-size="28" fill="#a855f7">result</text>

  <polygon points="1550,370 1550,380 1580,375" fill="#4ade80"/>

  <rect x="1590" y="340" width="220" height="70" rx="10" fill="#0a1a0a" stroke="#4ade80" stroke-width="4"/>
  <text x="1700" y="385" text-anchor="middle" font-family="monospace" font-size="28" fill="#4ade80">reward</text>

  <text x="1320" y="480" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Record successful trajectories.</text>
  <text x="1320" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#e0e0ff">Inject top examples on re-entry.</text>
  <text x="1320" y="580" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#4ade80" font-weight="bold">First-attempt success.</text>

  <text x="1320" y="640" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="96" fill="#4ade80" opacity="0.15">✓</text>

  <!-- Bottom: Four step types -->
  <rect x="60" y="740" width="1800" height="280" rx="20" fill="url(#cardGrad)"/>
  <rect x="60" y="740" width="1800" height="8" rx="4" fill="#a855f7"/>

  <text x="960" y="820" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#a855f7">Four Step Types</text>

  <!-- Meta -->
  <rect x="120" y="860" width="380" height="120" rx="12" fill="#0a0a14" stroke="#ffd93d" stroke-width="4"/>
  <text x="310" y="910" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#ffd93d">🧠 Meta</text>
  <text x="310" y="955" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#8080b0">Agent plans the work</text>

  <!-- Production -->
  <rect x="540" y="860" width="380" height="120" rx="12" fill="#0a0a14" stroke="#4ade80" stroke-width="4"/>
  <text x="730" y="910" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#4ade80">⚡ Production</text>
  <text x="730" y="955" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#8080b0">Agent executes</text>

  <!-- Deterministic -->
  <rect x="960" y="860" width="380" height="120" rx="12" fill="#0a0a14" stroke="#00d4ff" stroke-width="4"/>
  <text x="1150" y="910" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#00d4ff">⚙️ Deterministic</text>
  <text x="1150" y="955" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#8080b0">Machine tasks, no agent</text>

  <!-- Validation -->
  <rect x="1380" y="860" width="420" height="120" rx="12" fill="#0a0a14" stroke="#a855f7" stroke-width="4"/>
  <text x="1590" y="910" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#a855f7">🔍 Validation</text>
  <text x="1590" y="955" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#8080b0">Check outputs, score</text>
</svg>
