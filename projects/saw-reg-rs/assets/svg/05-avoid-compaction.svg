<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="1700" cy="800" r="160" fill="#f5a623" opacity="0.04"/>
  <circle cx="200" cy="200" r="100" fill="#a855f7" opacity="0.05"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#ffffff" filter="url(#glow)">avoid-compaction</text>
  <text x="960" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#f5a623">Structured Handoffs Between Sessions</text>

  <!-- Flow diagram: Session boxes with arrows -->
  <!-- Session 1 -->
  <rect x="60" y="220" width="380" height="280" rx="20" fill="url(#cardGrad)"/>
  <rect x="60" y="220" width="380" height="8" rx="4" fill="#4ade80"/>
  <text x="250" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#4ade80">Session 1</text>
  <text x="250" y="345" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ next</text>
  <text x="250" y="390" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">... work ...</text>
  <text x="250" y="435" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ complete</text>

  <!-- Arrow 1→2 -->
  <line x1="460" y1="360" x2="540" y2="360" stroke="#ffd93d" stroke-width="5"/>
  <polygon points="540,340 540,380 580,360" fill="#ffd93d"/>
  <text x="520" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#ffd93d">🤝</text>

  <!-- Session 2 -->
  <rect x="600" y="220" width="380" height="280" rx="20" fill="url(#cardGrad)"/>
  <rect x="600" y="220" width="380" height="8" rx="4" fill="#f5a623"/>
  <text x="790" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#f5a623">Session 2</text>
  <text x="790" y="345" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ next</text>
  <text x="790" y="390" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">... work ...</text>
  <text x="790" y="435" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ complete</text>

  <!-- Arrow 2→3 -->
  <line x1="1000" y1="360" x2="1080" y2="360" stroke="#ffd93d" stroke-width="5"/>
  <polygon points="1080,340 1080,380 1120,360" fill="#ffd93d"/>
  <text x="1060" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#ffd93d">🤝</text>

  <!-- Session 3 -->
  <rect x="1140" y="220" width="380" height="280" rx="20" fill="url(#cardGrad)"/>
  <rect x="1140" y="220" width="380" height="8" rx="4" fill="#a855f7"/>
  <text x="1330" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#a855f7">Session 3</text>
  <text x="1330" y="345" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ next</text>
  <text x="1330" y="390" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">... work ...</text>
  <text x="1330" y="435" text-anchor="middle" font-family="monospace" font-size="32" fill="#e0e0ff">$ complete</text>

  <!-- Dots continuing -->
  <text x="1600" y="370" font-family="Helvetica,Arial,sans-serif" font-size="56" fill="#ffd93d">...</text>

  <!-- vs. compaction -->
  <rect x="60" y="560" width="860" height="200" rx="20" fill="url(#cardGrad)"/>
  <rect x="60" y="560" width="860" height="8" rx="4" fill="#ff6b6b"/>
  <text x="490" y="640" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#ff6b6b">✗ Autocompaction Issues</text>
  <text x="490" y="700" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#8080b0">Long session → context lost → agent flounders</text>

  <rect x="1000" y="560" width="860" height="200" rx="20" fill="url(#cardGrad)"/>
  <rect x="1000" y="560" width="860" height="8" rx="4" fill="#4ade80"/>
  <text x="1430" y="640" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#4ade80">✓ With: Explicit Handoffs</text>
  <text x="1430" y="700" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#8080b0">Short sessions → fresh context → nothing lost</text>

  <!-- Bottom: three concept cards -->
  <rect x="60" y="820" width="580" height="200" rx="16" fill="url(#cardGrad)"/>
  <text x="350" y="890" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#f5a623">📋 Saga</text>
  <text x="350" y="945" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">The project goal</text>
  <text x="350" y="985" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Sequence of focused steps</text>

  <rect x="670" y="820" width="580" height="200" rx="16" fill="url(#cardGrad)"/>
  <text x="960" y="890" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#f5a623">🎯 Step</text>
  <text x="960" y="945" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Prompt + context files</text>
  <text x="960" y="985" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">One session, one task</text>

  <rect x="1280" y="820" width="580" height="200" rx="16" fill="url(#cardGrad)"/>
  <text x="1570" y="890" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#f5a623">🤝 Handoff</text>
  <text x="1570" y="945" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Summary of what happened</text>
  <text x="1570" y="985" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Next step defined explicitly</text>
</svg>
