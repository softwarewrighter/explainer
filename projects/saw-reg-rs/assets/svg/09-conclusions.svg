<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="120" fill="#4ade80" opacity="0.04"/>
  <circle cx="1700" cy="850" r="150" fill="#a855f7" opacity="0.04"/>
  <circle cx="960" cy="100" r="80" fill="#f5a623" opacity="0.05"/>

  <!-- Title -->
  <text x="960" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#ffffff" filter="url(#glow)">One Theme</text>
  <text x="960" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="48" fill="#ffd93d">Reduce Friction</text>

  <!-- Row 1: reg-rs -->
  <rect x="120" y="240" width="1680" height="200" rx="24" fill="url(#cardGrad)"/>
  <rect x="120" y="240" width="1680" height="8" rx="4" fill="#4ade80"/>

  <text x="200" y="340" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#4ade80">🧪</text>
  <text x="280" y="340" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#4ade80">reg-rs</text>
  <text x="960" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#e0e0ff">Tests visible in git</text>
  <text x="1700" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#4ade80">✓</text>

  <text x="280" y="400" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Binary → Text | .rgt + .out + .err | Shell aliases</text>

  <!-- Row 2: avoid-compaction -->
  <rect x="120" y="480" width="1680" height="200" rx="24" fill="url(#cardGrad)"/>
  <rect x="120" y="480" width="1680" height="8" rx="4" fill="#f5a623"/>

  <text x="200" y="580" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#f5a623">🔄</text>
  <text x="280" y="580" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#f5a623">avoid-compaction</text>
  <text x="1100" y="580" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#e0e0ff">Agents sharp across sessions</text>
  <text x="1700" y="580" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#f5a623">✓</text>

  <text x="280" y="640" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Sagas + Steps | Explicit handoffs | Append-only history</text>

  <!-- Row 3: agentrail-rs -->
  <rect x="120" y="720" width="1680" height="200" rx="24" fill="url(#cardGrad)"/>
  <rect x="120" y="720" width="1680" height="8" rx="4" fill="#a855f7"/>

  <text x="200" y="820" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#a855f7">🎯</text>
  <text x="280" y="820" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#a855f7">agentrail-rs</text>
  <text x="1000" y="820" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#e0e0ff">Agents learn from examples</text>
  <text x="1700" y="820" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="64" fill="#a855f7">✓</text>

  <text x="280" y="880" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#8080b0">Trajectories + Rewards | ICRL | Five-crate workspace</text>

  <!-- Bottom: Sharpen the Saw -->
  <text x="960" y="1010" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="bold" fill="#ffd93d" filter="url(#glow)">🔧 Sharpen the Saw 🔧</text>
</svg>
