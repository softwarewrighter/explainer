<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Gear decorations -->
  <text x="1750" y="150" font-size="80" opacity="0.15">⚙️</text>
  <text x="150" y="950" font-size="60" opacity="0.1">⚙️</text>
  <text x="1600" y="850" font-size="50" opacity="0.1">🔧</text>

  <!-- Headline -->
  <text x="100" y="110" font-family="Arial" font-size="60" fill="#ffd93d">⚙️</text>
  <text x="180" y="110" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#fff">
    Environment Management
  </text>

  <!-- evpj commands panel -->
  <rect x="100" y="180" width="820" height="420" rx="24" fill="url(#cardGrad)"/>

  <text x="180" y="260" font-family="Arial" font-size="48" fill="#4ade80">📝</text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80">
    Config via evpj
  </text>

  <!-- Terminal examples -->
  <rect x="150" y="310" width="720" height="80" rx="10" fill="#0a0a14"/>
  <text x="180" y="362" font-family="Courier New, monospace" font-size="32" fill="#4ade80">
    evpj webapp set DB_URL postgres://...
  </text>

  <text x="180" y="430" font-family="Arial, sans-serif" font-size="36" fill="#888">
    Set environment variables per project
  </text>

  <rect x="150" y="470" width="720" height="80" rx="10" fill="#0a0a14"/>
  <text x="180" y="522" font-family="Courier New, monospace" font-size="32" fill="#00d4ff">
    evpj webapp on-enter "source .venv/..."
  </text>

  <text x="180" y="590" font-family="Arial, sans-serif" font-size="36" fill="#888">
    Run commands when entering project
  </text>

  <!-- .pjmai.sh panel -->
  <rect x="1000" y="180" width="820" height="420" rx="24" fill="url(#cardGrad)"/>

  <text x="1080" y="260" font-family="Arial" font-size="48" fill="#ffd93d">📄</text>
  <text x="1150" y="265" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#ffd93d">
    File: .pjmai.sh
  </text>

  <!-- File content mockup -->
  <rect x="1050" y="310" width="720" height="160" rx="10" fill="#0a0a14"/>
  <text x="1080" y="355" font-family="Courier New, monospace" font-size="30" fill="#888">
    # ~/myproject/.pjmai.sh
  </text>
  <text x="1080" y="400" font-family="Courier New, monospace" font-size="30" fill="#ccc">
    source .venv/bin/activate
  </text>
  <text x="1080" y="445" font-family="Courier New, monospace" font-size="30" fill="#ccc">
    export SRCROOT=$PWD
  </text>

  <text x="1080" y="530" font-family="Arial, sans-serif" font-size="36" fill="#ffd93d">
    🔒 Hash-based approval
  </text>
  <text x="1080" y="580" font-family="Arial, sans-serif" font-size="34" fill="#888">
    Auto-sources if unchanged
  </text>

  <!-- Security model bar -->
  <rect x="100" y="660" width="1720" height="300" rx="24" fill="url(#cardGrad)"/>

  <text x="200" y="740" font-family="Arial" font-size="52" fill="#ff6b6b">🔐</text>
  <text x="280" y="745" font-family="Arial, sans-serif" font-size="52"
        font-weight="bold" fill="#ff6b6b">
    Security Model
  </text>

  <!-- Security flow -->
  <rect x="200" y="790" width="360" height="130" rx="12" fill="#0a0a14"/>
  <text x="380" y="840" font-family="Arial" font-size="36" fill="#ff6b6b" text-anchor="middle">
    First Visit
  </text>
  <text x="380" y="890" font-family="Arial" font-size="30" fill="#888" text-anchor="middle">
    Warning shown
  </text>

  <polygon points="590,855 650,830 650,845 700,845 700,865 650,865 650,880" fill="#ffd93d"/>

  <rect x="730" y="790" width="360" height="130" rx="12" fill="#0a0a14"/>
  <text x="910" y="840" font-family="Arial" font-size="36" fill="#ffd93d" text-anchor="middle">
    srcpj
  </text>
  <text x="910" y="890" font-family="Arial" font-size="30" fill="#888" text-anchor="middle">
    Review and approve
  </text>

  <polygon points="1120,855 1180,830 1180,845 1230,845 1230,865 1180,865 1180,880" fill="#4ade80"/>

  <rect x="1260" y="790" width="460" height="130" rx="12" fill="#0a0a14"/>
  <text x="1490" y="840" font-family="Arial" font-size="36" fill="#4ade80" text-anchor="middle">
    Future Visits
  </text>
  <text x="1490" y="890" font-family="Arial" font-size="30" fill="#888" text-anchor="middle">
    Auto-sources if hash matches
  </text>
</svg>
