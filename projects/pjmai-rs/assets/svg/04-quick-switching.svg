<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Speed lines decoration -->
  <line x1="0" y1="300" x2="200" y2="300" stroke="#00d4ff" stroke-width="3" opacity="0.3"/>
  <line x1="0" y1="320" x2="150" y2="320" stroke="#00d4ff" stroke-width="2" opacity="0.2"/>
  <line x1="0" y1="340" x2="100" y2="340" stroke="#00d4ff" stroke-width="2" opacity="0.15"/>

  <line x1="1920" y1="700" x2="1720" y2="700" stroke="#4ade80" stroke-width="3" opacity="0.3"/>
  <line x1="1920" y1="720" x2="1770" y2="720" stroke="#4ade80" stroke-width="2" opacity="0.2"/>

  <!-- Headline with lightning bolt -->
  <text x="880" y="110" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#fff" text-anchor="middle">
    Quick Switching
  </text>
  <text x="1480" y="110" font-family="Arial" font-size="72" fill="#ffd93d">⚡</text>

  <!-- Fuzzy matching panel -->
  <rect x="100" y="180" width="820" height="440" rx="24" fill="url(#cardGrad)"/>

  <text x="180" y="260" font-family="Arial" font-size="52" fill="#4ade80">🔍</text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="52"
        font-weight="bold" fill="#4ade80">
    Fuzzy Matching
  </text>

  <!-- Terminal examples -->
  <rect x="150" y="310" width="720" height="70" rx="10" fill="#0a0a14"/>
  <text x="180" y="358" font-family="Courier New, monospace" font-size="38" fill="#4ade80">
    chpj webapp
  </text>
  <text x="720" y="358" font-family="Arial, sans-serif" font-size="32" fill="#888">
    exact match
  </text>

  <rect x="150" y="400" width="720" height="70" rx="10" fill="#0a0a14"/>
  <text x="180" y="448" font-family="Courier New, monospace" font-size="38" fill="#00d4ff">
    chpj WEBAPP
  </text>
  <text x="720" y="448" font-family="Arial, sans-serif" font-size="32" fill="#888">
    case insensitive
  </text>

  <rect x="150" y="490" width="720" height="70" rx="10" fill="#0a0a14"/>
  <text x="180" y="538" font-family="Courier New, monospace" font-size="38" fill="#ffd93d">
    chpj web
  </text>
  <text x="720" y="538" font-family="Arial, sans-serif" font-size="32" fill="#888">
    prefix match
  </text>

  <!-- Stack navigation panel -->
  <rect x="1000" y="180" width="820" height="440" rx="24" fill="url(#cardGrad)"/>

  <text x="1080" y="260" font-family="Arial" font-size="52" fill="#ffd93d">📚</text>
  <text x="1150" y="265" font-family="Arial, sans-serif" font-size="52"
        font-weight="bold" fill="#ffd93d">
    Stack Navigation
  </text>

  <!-- Stack visualization -->
  <rect x="1050" y="310" width="300" height="60" rx="8" fill="#0a0a14" stroke="#4ade80" stroke-width="3"/>
  <text x="1200" y="350" font-family="Courier New, monospace" font-size="32" fill="#4ade80" text-anchor="middle">
    webapp
  </text>
  <text x="1380" y="350" font-family="Arial" font-size="28" fill="#888">← current</text>

  <text x="1200" y="410" font-family="Arial" font-size="32" fill="#ffd93d" text-anchor="middle">↓ pspj api</text>

  <rect x="1050" y="440" width="300" height="50" rx="8" fill="#0a0a14" stroke="#888" stroke-width="2" opacity="0.6"/>
  <text x="1200" y="475" font-family="Courier New, monospace" font-size="28" fill="#888" text-anchor="middle">
    webapp
  </text>
  <rect x="1050" y="500" width="300" height="60" rx="8" fill="#0a0a14" stroke="#4ade80" stroke-width="3"/>
  <text x="1200" y="540" font-family="Courier New, monospace" font-size="32" fill="#4ade80" text-anchor="middle">
    api
  </text>
  <text x="1380" y="540" font-family="Arial" font-size="28" fill="#888">← current</text>

  <text x="1530" y="420" font-family="Arial" font-size="36" fill="#ff6b6b">popj</text>
  <text x="1530" y="460" font-family="Arial" font-size="32" fill="#888">returns to</text>
  <text x="1530" y="495" font-family="Arial" font-size="32" fill="#888">previous</text>

  <!-- Aliases bar -->
  <rect x="100" y="680" width="1720" height="280" rx="24" fill="url(#cardGrad)"/>

  <text x="200" y="760" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#00d4ff">
    Shell Aliases
  </text>
  <text x="200" y="810" font-family="Arial, sans-serif" font-size="36" fill="#888">
    Short commands, always available
  </text>

  <!-- Alias chips -->
  <rect x="200" y="850" width="140" height="70" rx="35" fill="#00d4ff" opacity="0.2"/>
  <text x="270" y="895" font-family="Courier New, monospace" font-size="36" fill="#00d4ff" text-anchor="middle">adpj</text>

  <rect x="380" y="850" width="140" height="70" rx="35" fill="#4ade80" opacity="0.2"/>
  <text x="450" y="895" font-family="Courier New, monospace" font-size="36" fill="#4ade80" text-anchor="middle">chpj</text>

  <rect x="560" y="850" width="140" height="70" rx="35" fill="#ffd93d" opacity="0.2"/>
  <text x="630" y="895" font-family="Courier New, monospace" font-size="36" fill="#ffd93d" text-anchor="middle">lspj</text>

  <rect x="740" y="850" width="140" height="70" rx="35" fill="#ff6b6b" opacity="0.2"/>
  <text x="810" y="895" font-family="Courier New, monospace" font-size="36" fill="#ff6b6b" text-anchor="middle">rmpj</text>

  <rect x="920" y="850" width="140" height="70" rx="35" fill="#00d4ff" opacity="0.2"/>
  <text x="990" y="895" font-family="Courier New, monospace" font-size="36" fill="#00d4ff" text-anchor="middle">pspj</text>

  <rect x="1100" y="850" width="140" height="70" rx="35" fill="#4ade80" opacity="0.2"/>
  <text x="1170" y="895" font-family="Courier New, monospace" font-size="36" fill="#4ade80" text-anchor="middle">popj</text>

  <rect x="1280" y="850" width="140" height="70" rx="35" fill="#ffd93d" opacity="0.2"/>
  <text x="1350" y="895" font-family="Courier New, monospace" font-size="36" fill="#ffd93d" text-anchor="middle">shpj</text>
</svg>
