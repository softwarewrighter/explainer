<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Dark dramatic background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="50%" style="stop-color:#1a1520"/>
      <stop offset="100%" style="stop-color:#0a0a12"/>
    </linearGradient>

    <!-- Golden metallic gradient for main text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="25%" style="stop-color:#ffec80"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="75%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>

    <!-- Bronze/copper for 3D depth layers -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513"/>
      <stop offset="50%" style="stop-color:#654321"/>
      <stop offset="100%" style="stop-color:#3d2914"/>
    </linearGradient>

    <!-- Dark shadow gradient -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a0a"/>
      <stop offset="100%" style="stop-color:#0a0500"/>
    </linearGradient>

    <!-- Subtitle glow -->
    <filter id="subtitleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text shadow for depth -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative lines (adventure movie style) -->
  <line x1="200" y1="180" x2="800" y2="180" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <line x1="1120" y1="180" x2="1720" y2="180" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <line x1="200" y1="900" x2="800" y2="900" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <line x1="1120" y1="900" x2="1720" y2="900" stroke="#d4af37" stroke-width="3" opacity="0.6"/>

  <!-- Diamond ornaments -->
  <polygon points="960,160 980,180 960,200 940,180" fill="#d4af37" opacity="0.8"/>
  <polygon points="960,880 980,900 960,920 940,900" fill="#d4af37" opacity="0.8"/>

  <!-- Main Title: PROJECT MANAGEMENT -->
  <!-- 3D depth layers (back to front) -->
  <text x="960" y="340" font-family="Impact, Arial Black, sans-serif" font-size="120"
        font-weight="bold" fill="url(#shadowGrad)" text-anchor="middle"
        transform="translate(12, 12)">
    PROJECT MANAGEMENT
  </text>
  <text x="960" y="340" font-family="Impact, Arial Black, sans-serif" font-size="120"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(8, 8)">
    PROJECT MANAGEMENT
  </text>
  <text x="960" y="340" font-family="Impact, Arial Black, sans-serif" font-size="120"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(5, 5)">
    PROJECT MANAGEMENT
  </text>
  <text x="960" y="340" font-family="Impact, Arial Black, sans-serif" font-size="120"
        font-weight="bold" fill="url(#goldGrad)" text-anchor="middle"
        filter="url(#textShadow)">
    PROJECT MANAGEMENT
  </text>

  <!-- Second line: FOR AI AGENTS -->
  <text x="960" y="500" font-family="Impact, Arial Black, sans-serif" font-size="140"
        font-weight="bold" fill="url(#shadowGrad)" text-anchor="middle"
        transform="translate(14, 14)">
    FOR AI AGENTS
  </text>
  <text x="960" y="500" font-family="Impact, Arial Black, sans-serif" font-size="140"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(10, 10)">
    FOR AI AGENTS
  </text>
  <text x="960" y="500" font-family="Impact, Arial Black, sans-serif" font-size="140"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(6, 6)">
    FOR AI AGENTS
  </text>
  <text x="960" y="500" font-family="Impact, Arial Black, sans-serif" font-size="140"
        font-weight="bold" fill="url(#goldGrad)" text-anchor="middle"
        filter="url(#textShadow)">
    FOR AI AGENTS
  </text>

  <!-- Third line: IN RUST -->
  <text x="960" y="660" font-family="Impact, Arial Black, sans-serif" font-size="160"
        font-weight="bold" fill="url(#shadowGrad)" text-anchor="middle"
        transform="translate(16, 16)">
    IN RUST
  </text>
  <text x="960" y="660" font-family="Impact, Arial Black, sans-serif" font-size="160"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(12, 12)">
    IN RUST
  </text>
  <text x="960" y="660" font-family="Impact, Arial Black, sans-serif" font-size="160"
        font-weight="bold" fill="url(#bronzeGrad)" text-anchor="middle"
        transform="translate(7, 7)">
    IN RUST
  </text>
  <text x="960" y="660" font-family="Impact, Arial Black, sans-serif" font-size="160"
        font-weight="bold" fill="url(#goldGrad)" text-anchor="middle"
        filter="url(#textShadow)">
    IN RUST
  </text>

  <!-- Subtitle with cyan glow -->
  <text x="960" y="780" font-family="Arial, sans-serif" font-size="48"
        fill="#00d4ff" text-anchor="middle" filter="url(#subtitleGlow)">
    PJMAI-RS: The Developer Adventure Toolkit
  </text>

  <!-- Version/tech badge -->
  <rect x="810" y="820" width="300" height="50" rx="8" fill="#1a1a2e" stroke="#d4af37" stroke-width="3"/>
  <text x="960" y="855" font-family="Courier New, monospace" font-size="32"
        fill="#ffd700" text-anchor="middle" font-weight="bold">
    v0.4.0 | Phase 3
  </text>
</svg>
