<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Magic sparkles decoration -->
  <text x="100" y="150" font-size="60" opacity="0.3">✨</text>
  <text x="1780" y="200" font-size="50" opacity="0.25">✨</text>
  <text x="1650" y="900" font-size="40" opacity="0.2">✨</text>

  <!-- Headline -->
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#fff" text-anchor="middle">
    Shell Integration
  </text>
  <text x="960" y="170" font-family="Arial, sans-serif" font-size="56"
        fill="#ffd93d" text-anchor="middle" filter="url(#glow)">
    ✨ The Magic ✨
  </text>

  <!-- Challenge vs Solution -->
  <!-- Challenge box -->
  <rect x="100" y="230" width="800" height="260" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="230" width="6" height="260" rx="3" fill="#ff6b6b"/>

  <text x="160" y="300" font-family="Arial" font-size="48" fill="#ff6b6b">🚫</text>
  <text x="230" y="305" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#ff6b6b">
    The Challenge
  </text>
  <text x="160" y="380" font-family="Arial, sans-serif" font-size="42" fill="#ccc">
    CLI runs as subprocess
  </text>
  <text x="160" y="450" font-family="Arial, sans-serif" font-size="42" fill="#aaa">
    Cannot directly change parent shell
  </text>

  <!-- Solution box -->
  <rect x="1020" y="230" width="800" height="260" rx="24" fill="url(#cardGrad)"/>
  <rect x="1020" y="230" width="6" height="260" rx="3" fill="#4ade80"/>

  <text x="1080" y="300" font-family="Arial" font-size="48" fill="#4ade80">💡</text>
  <text x="1150" y="305" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" fill="#4ade80">
    The Solution
  </text>
  <text x="1080" y="380" font-family="Arial, sans-serif" font-size="42" fill="#ccc">
    Exit codes as signals
  </text>
  <text x="1080" y="450" font-family="Arial, sans-serif" font-size="42" fill="#aaa">
    Shell wrapper interprets actions
  </text>

  <!-- Exit code protocol - visual diagram -->
  <rect x="100" y="540" width="1720" height="420" rx="24" fill="url(#cardGrad)"/>

  <text x="960" y="610" font-family="Arial, sans-serif" font-size="52"
        font-weight="bold" fill="#00d4ff" text-anchor="middle">
    Exit Code Protocol
  </text>

  <!-- Exit 2 -->
  <rect x="180" y="660" width="480" height="120" rx="16" fill="#0a0a1a"/>
  <rect x="180" y="660" width="100" height="120" rx="16" fill="#00d4ff" opacity="0.2"/>
  <text x="230" y="735" font-family="Courier New, monospace" font-size="48"
        fill="#00d4ff" font-weight="bold">2</text>
  <text x="320" y="715" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Change Directory
  </text>
  <text x="320" y="760" font-family="Courier New, monospace" font-size="32" fill="#aaa">
    cd to output path
  </text>

  <!-- Exit 3 -->
  <rect x="720" y="660" width="480" height="120" rx="16" fill="#0a0a1a"/>
  <rect x="720" y="660" width="100" height="120" rx="16" fill="#4ade80" opacity="0.2"/>
  <text x="770" y="735" font-family="Courier New, monospace" font-size="48"
        fill="#4ade80" font-weight="bold">3</text>
  <text x="860" y="715" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Source File
  </text>
  <text x="860" y="760" font-family="Courier New, monospace" font-size="32" fill="#aaa">
    source output path
  </text>

  <!-- Exit 5 -->
  <rect x="1260" y="660" width="480" height="120" rx="16" fill="#0a0a1a"/>
  <rect x="1260" y="660" width="100" height="120" rx="16" fill="#ffd93d" opacity="0.2"/>
  <text x="1310" y="735" font-family="Courier New, monospace" font-size="48"
        fill="#ffd93d" font-weight="bold">5</text>
  <text x="1400" y="715" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Execute Env Script
  </text>
  <text x="1400" y="760" font-family="Courier New, monospace" font-size="32" fill="#aaa">
    eval env setup
  </text>

  <!-- Arrows showing flow -->
  <path d="M460,850 L460,830 L960,830 L960,800" stroke="#00d4ff" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <path d="M960,850 L960,800" stroke="#4ade80" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <path d="M1460,850 L1460,830 L960,830" stroke="#ffd93d" stroke-width="3" fill="none" stroke-dasharray="8,4"/>

  <text x="960" y="920" font-family="Arial, sans-serif" font-size="40"
        fill="#aaa" text-anchor="middle">
    Shell wrapper reads code, executes action
  </text>
</svg>
