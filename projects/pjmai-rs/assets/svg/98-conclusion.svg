<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Celebration decorations -->
  <text x="100" y="180" font-size="50" opacity="0.3">🎯</text>
  <text x="1780" cy="150" font-size="50" opacity="0.3">✨</text>
  <text x="1700" y="900" font-size="40" opacity="0.2">🚀</text>

  <!-- Headline -->
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="84"
        font-weight="bold" fill="#fff" text-anchor="middle">
    PJMAI-RS Summary
  </text>
  <text x="960" y="160" font-family="Arial, sans-serif" font-size="44"
        fill="#ffd93d" text-anchor="middle">
    Transform how you navigate your codebase
  </text>

  <!-- Benefit cards -->
  <rect x="100" y="220" width="520" height="220" rx="20" fill="url(#cardGrad)"/>
  <circle cx="180" cy="310" r="40" fill="#4ade80" opacity="0.2"/>
  <text x="180" y="325" font-family="Arial" font-size="44" fill="#4ade80" text-anchor="middle">⚡</text>
  <text x="240" y="325" font-family="Arial, sans-serif" font-size="44"
        font-weight="bold" fill="#4ade80">
    Instant Switch
  </text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Short aliases
  </text>
  <text x="150" y="430" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Fuzzy matching
  </text>

  <rect x="700" y="220" width="520" height="220" rx="20" fill="url(#cardGrad)"/>
  <circle cx="780" cy="310" r="40" fill="#ffd93d" opacity="0.2"/>
  <text x="780" y="325" font-family="Arial" font-size="44" fill="#ffd93d" text-anchor="middle">📚</text>
  <text x="840" y="325" font-family="Arial, sans-serif" font-size="44"
        font-weight="bold" fill="#ffd93d">
    Stack Navigation
  </text>
  <text x="750" y="390" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Push, pop
  </text>
  <text x="750" y="430" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Return easily
  </text>

  <rect x="1300" y="220" width="520" height="220" rx="20" fill="url(#cardGrad)"/>
  <circle cx="1380" cy="310" r="40" fill="#ff6b6b" opacity="0.2"/>
  <text x="1380" y="325" font-family="Arial" font-size="44" fill="#ff6b6b" text-anchor="middle">⚙️</text>
  <text x="1440" y="325" font-family="Arial, sans-serif" font-size="44"
        font-weight="bold" fill="#ff6b6b">
    Per Project Env
  </text>
  <text x="1350" y="390" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Variables
  </text>
  <text x="1350" y="430" font-family="Arial, sans-serif" font-size="36" fill="#ccc">
    Entry hooks
  </text>

  <!-- Version banner -->
  <rect x="100" y="500" width="1720" height="180" rx="24" fill="url(#cardGrad)"/>
  <rect x="100" y="500" width="1720" height="8" rx="4" fill="url(#goldGrad)"/>

  <text x="200" y="590" font-family="Arial, sans-serif" font-size="52"
        font-weight="bold" fill="#ffd93d">
    ✓ Version 0.4.0
  </text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="52"
        fill="#fff">
    Phase 3 Complete
  </text>
  <text x="200" y="650" font-family="Arial, sans-serif" font-size="38" fill="#aaa">
    Full environment configuration, hash-based approval, on-enter hooks
  </text>

  <!-- Roadmap -->
  <rect x="100" y="740" width="1720" height="220" rx="24" fill="url(#cardGrad)"/>

  <text x="200" y="820" font-family="Arial, sans-serif" font-size="44"
        font-weight="bold" fill="#aaa">
    🗺️ Roadmap
  </text>

  <!-- Phase chips -->
  <rect x="200" y="860" width="380" height="70" rx="35" fill="#a855f7" opacity="0.2"/>
  <text x="390" y="905" font-family="Arial, sans-serif" font-size="34" fill="#a855f7" text-anchor="middle">
    Phase 4: AI Sandboxing
  </text>

  <rect x="620" y="860" width="420" height="70" rx="35" fill="#00d4ff" opacity="0.2"/>
  <text x="830" y="905" font-family="Arial, sans-serif" font-size="34" fill="#00d4ff" text-anchor="middle">
    Phase 5: Containers
  </text>

  <rect x="1080" y="860" width="350" height="70" rx="35" fill="#4ade80" opacity="0.2"/>
  <text x="1255" y="905" font-family="Arial, sans-serif" font-size="34" fill="#4ade80" text-anchor="middle">
    And beyond...
  </text>
</svg>
